function pronosticoConsenso(estId) {
  const hoy = hoyISO();
  const ids = fuentesActivas(f => f.tipo === 'om' || f.pronostico).map(f => f.id);
  const dias = [];
  for (let i = 0; i < 7; i++) {
    const f = addDays(hoy, i);
    const p = promedioFuentes(estId, f, ids, 'precip');
    if (!p.n) continue;
    const tx = promedioFuentes(estId, f, ids, 'tmax'), tn = promedioFuentes(estId, f, ids, 'tmin');
    const conLluvia = p.vals.filter(v => v >= 1).length;
    let wcode = null;
    for (const id of ['ecmwf', 'icon', 'gfs', 'ukmo', 'mf']) { const c = climaDe(estId, f, id); if (c && c.wcode !== null) { wcode = c.wcode; break; } }
    dias.push({ fecha: f, mm: p.media, min: p.min, max: p.max, n: p.n, conLluvia, tmax: tx.media, tmin: tn.media, wcode });
  }
  return dias;
}

function serieAcumuladaAnual(estId, y, inicioMes) {
  // Lluvia acumulada día a día desde el inicio del año (o del año agrícola)
  const ini = inicioMes > 1 ? y + '-' + pad2(inicioMes) + '-01' : y + '-01-01';
  const fin = addDays(inicioMes > 1 ? (y + 1) + '-' + pad2(inicioMes) + '-01' : (y + 1) + '-01-01', -1);
  const fechas = rangoFechas(ini, fin);
  const mapa = lluviaManual(estId, false);
  const hoy = hoyISO();
  let acc = 0;
  return fechas.map(f => { if (f > hoy) return null; acc += mapa.get(f) || 0; return redondear(acc, 1); });
}

function promedioAnualPrevio(estId) {
  // Promedio de años calendario completos anteriores (y lo acumulado a la misma fecha)
  const hoy = hoyISO(), y = anio(hoy), md = hoy.slice(5);
  const primer = primerRegistro(estId);
  const mapa = lluviaManual(estId, false);
  const anios = aniosConDatos(estId).filter(a => a < y && primer && primer <= a + '-01-15');
  if (!anios.length) return null;
  const tot = anios.map(a => { let s = 0; for (const [f, v] of mapa) if (anio(f) === a) s += v; return s; });
  const mismo = anios.map(a => { let s = 0; for (const [f, v] of mapa) if (anio(f) === a && f.slice(5) <= md) s += v; return s; });
  return { total: media(tot), aFecha: media(mismo), n: anios.length, desde: anios[0], hasta: anios[anios.length - 1] };
}

/* ============================================================
   Vista: Día (lecturas + clima hora por hora)
   ============================================================ */

const estadoDia = { fecha: null, est: null, ventana: null, pidiendo: false, intentados: new Set() };

function abrirDia(fecha, estId) {
  if (vistaActual && vistaActual !== 'dia') estadoDia.desde = vistaActual;
  estadoDia.fecha = fecha; estadoDia.est = estId || S.cfg.estacionActiva; estadoDia.ventana = null;
  if (vistaActual === 'dia') renderVista(); else irA('dia');
  window.scrollTo(0, 0);
}

// Devuelve las 24 horas de la ventana: [{fecha, hora}] y etiquetas
function horasVentana(fecha, modo, hLect) {
  const out = [];
  if (modo === 'lectura' && hLect) {
    const H = +hLect.slice(0, 2);
    const ant = addDays(fecha, -1);
    for (let h = H + 1; h <= 23; h++) out.push({ fecha: ant, hora: h });
    for (let h = 0; h <= H; h++) out.push({ fecha, hora: h });
  } else for (let h = 0; h <= 23; h++) out.push({ fecha, hora: h });
  return out;
}
function valorHora(estId, fuente, campo, x) {
  const r = horarioDe(estId, x.fecha, fuente);
  if (!r || !r.horas || !r.horas[campo]) return null;
  const v = r.horas[campo][x.hora];
  return v === undefined ? null : v;
}

function modeloDia(est, fecha) {
  const regs = registrosDe(est.id).filter(r => r.fecha === fecha);
  const total = suma(regs.map(r => r.mm));
  const horasL = regs.map(r => r.hora).filter(Boolean).sort();
  const hLect = horasL.length ? horasL[horasL.length - 1] : null;
  const modo = (estadoDia.ventana || (hLect ? S.cfg.ventanaDia || 'lectura' : 'dia')) === 'lectura' && hLect ? 'lectura' : 'dia';
  const horas = horasVentana(fecha, modo, hLect);
  const etq = horas.map(x => pad2(x.hora) + ':00');
  const etqTip = horas.map(x => capital(fmtFecha(x.fecha, 'dia')) + ' ' + pad2(x.hora) + ':00' + ' · lluvia ' + pad2((x.hora + 23) % 24) + '–' + pad2(x.hora) + ' h');
  const ref = c => horas.map(x => valorHora(est.id, 'ref', c, x));
  const precip = ref('precip'), temp = ref('temp'), hum = ref('hum'), rocio = ref('rocio'), nubes = ref('nubes'), pres = ref('presion'), vto = ref('viento'), raf = ref('rafaga'), dir = ref('dir'), wc = ref('wcode');
  const modelos = fuentesActivas(f => f.tipo === 'om').filter(f => horas.some(x => valorHora(est.id, f.id, 'precip', x) !== null));
  const porModelo = modelos.map(f => horas.map(x => valorHora(est.id, f.id, 'precip', x)));
  const promMod = horas.map((_, i) => { const v = porModelo.map(a => a[i]).filter(v => v !== null); return v.length ? redondear(suma(v) / v.length, 1) : null; });
  const minMod = horas.map((_, i) => { const v = porModelo.map(a => a[i]).filter(v => v !== null); return v.length > 1 ? Math.min(...v) : null; });
  const maxMod = horas.map((_, i) => { const v = porModelo.map(a => a[i]).filter(v => v !== null); return v.length > 1 ? Math.max(...v) : null; });
  const hayRef = precip.some(v => v !== null);
  const totRef = hayRef ? suma(precip) : null;
  let iMax = -1; precip.forEach((v, i) => { if (v !== null && v > 0 && (iMax < 0 || v > precip[iMax])) iMax = i; });
  const lluvHoras = precip.filter(v => v !== null && v >= 0.1).length;
  const tmx = temp.some(v => v !== null) ? Math.max(...temp.filter(v => v !== null)) : null;
  const tmn = temp.some(v => v !== null) ? Math.min(...temp.filter(v => v !== null)) : null;
  const rafMax = raf.some(v => v !== null) ? Math.max(...raf.filter(v => v !== null)) : null;
  const presMin = pres.some(v => v !== null) ? Math.min(...pres.filter(v => v !== null)) : null;
  const origen = (horarioDe(est.id, fecha, 'ref') || {}).origen;
  const fuenteRef = origen === 'reciente' ? 'Modelo de alta resolución (datos recientes)' : 'Archivo histórico ECMWF IFS / ERA5';
  const ventanaTxt = modo === 'lectura' ? '24 h hasta su lectura de las ' + hLect + ' (desde las ' + hLect.slice(0, 2) + ':00 del ' + fmtFecha(addDays(fecha, -1), 'diaMes') + ')' : 'Día calendario (00:00 a 24:00)';

  const m = {
    titulo: 'Informe del día', est, per: { etiqueta: capital(fmtFecha(fecha, 'diaMes')) + ' ' + anio(fecha) },
    subtituloDoc: 'Informe del día ' + capital(fmtFecha(fecha, 'diaMes')) + ' ' + anio(fecha) + '. Pluviómetro ' + est.nombre,
    archivo: 'informe-dia-' + fecha,
    regs, total, hLect, modo, horas, hayRef, ventanaTxt, fuenteRef,
    kpis: [
      { lbl: 'Pluviómetro', val: fmtMM(total) + ' mm', sub: regs.length ? regs.length + (regs.length === 1 ? ' lectura' : ' lecturas') + (hLect ? ' · ' + hLect : '') : 'Sin lecturas' },
      { lbl: 'Lluvia por hora (modelo)', val: hayRef ? fmtMM(totRef) + ' mm' : '—', sub: hayRef ? lluvHoras + (lluvHoras === 1 ? ' hora con lluvia' : ' horas con lluvia') : 'Sin datos horarios' },
      { lbl: 'Hora más lluviosa', val: iMax >= 0 ? etq[iMax] : '—', sub: iMax >= 0 ? fmtMM(precip[iMax]) + ' mm en esa hora' : '' },
      { lbl: 'Temperatura', val: tmx !== null ? fmtNum(tmx, 0) + '° / ' + fmtNum(tmn, 0) + '°' : '—', sub: [rafMax !== null ? 'Ráfaga ' + fmtNum(rafMax, 0) + ' km/h' : '', presMin !== null ? 'Presión mín. ' + fmtNum(presMin, 0) + ' hPa' : ''].filter(Boolean).join(' · ') },
    ],
    secciones: [],

  if (hayRef) {
    m.secciones.push({
      titulo: 'Lluvia hora por hora', texto: ventanaTxt + '. Barras: ' + fuenteRef.toLowerCase() + '. Puntos: promedio de los modelos; franja: rango entre modelos. Cada valor es la lluvia de la hora anterior.',

    });
    m.secciones.push({
      titulo: 'Temperatura y punto de rocío', texto: 'Cuando la temperatura se acerca al punto de rocío, el aire está casi saturado.',
      grafico: { tipo: 'grafico', spec: { etiquetas: etq, etiquetasTooltip: etqTip, series: [{ nombre: 'Temperatura', color: PALETA[1], tipo: 'linea', valores: temp }, { nombre: 'Punto de rocío', color: PALETA[0], tipo: 'linea', valores: rocio }], unidad: '°C', unidadTooltip: '°C', yDesdeCero: false, alto: 200 } },
    });
    m.secciones.push({
      titulo: 'Viento', texto: 'Velocidad media y ráfagas a 10 metros de altura.',
      grafico: { tipo: 'grafico', spec: { etiquetas: etq, etiquetasTooltip: etqTip, series: [{ nombre: 'Viento', color: PALETA[2], tipo: 'linea', valores: vto }, { nombre: 'Ráfagas', color: PALETA[4], tipo: 'linea', valores: raf }], unidad: 'km/h', unidadTooltip: 'km/h', alto: 180 } },
    });
    m.secciones.push({
      titulo: 'Registro horario del clima', texto: fuenteRef + '. Las filas resaltadas tuvieron lluvia.',
      tabla: {
        cab: ['Hora', 'Lluvia mm', 'Temp. °C', 'Hum. %', 'Rocío °C', 'Nubes %', 'Presión hPa', 'Viento km/h', 'Ráfaga', 'Dir.', 'Tiempo'],
        filas: horas.map((x, i) => [(x.fecha !== fecha ? fmtFecha(x.fecha, 'dia') + ' ' : '') + etq[i], fmtMM(precip[i]), fmtNum(temp[i]), fmtNum(hum[i], 0), fmtNum(rocio[i]), fmtNum(nubes[i], 0), fmtNum(pres[i], 0), fmtNum(vto[i], 0), fmtNum(raf[i], 0), dirTexto(dir[i]), textoWMO(wc[i])]),
        resaltar: precip.map(v => v !== null && v >= 0.1), izq: [0, 10],
      },
    });
    if (modelos.length) {
      const filasM = [];
      horas.forEach((x, i) => { if (porModelo.some(a => a[i] !== null && a[i] >= 0.1) || (precip[i] || 0) >= 0.1) filasM.push([(x.fecha !== fecha ? fmtFecha(x.fecha, 'dia') + ' ' : '') + etq[i], fmtMM(precip[i]), ...porModelo.map(a => fmtMM(a[i])), fmtMM(promMod[i])]); });
      filasM.push(['Total', fmtMM(totRef), ...porModelo.map(a => fmtMM(suma(a))), fmtMM(suma(promMod))]);
      m.secciones.push({
        titulo: 'Lluvia por hora según cada modelo', texto: filasM.length > 1 ? 'Solo se muestran las horas en que alguna fuente indicó lluvia.' : 'Ninguna fuente indicó lluvia en esta ventana.',
        tabla: { cab: ['Hora', 'Referencia', ...modelos.map(f => f.corto), 'Promedio'], filas: filasM, ultimaTotal: true },
      });
    }
  }
  // Clima diario por fuente
  const filasD = FUENTES.map(f => ({ f, c: climaDe(est.id, fecha, f.id) })).filter(x => x.c);
  if (filasD.length) m.secciones.push({
    titulo: 'Resumen diario por fuente', texto: 'Totales y extremos del día calendario según cada fuente.',
    tabla: { cab: ['Fuente', 'Lluvia mm', 'Tmáx °C', 'Tmín °C', 'Hum. %', 'Viento km/h', 'Ráfaga', 'ET₀ mm', 'Tiempo'], filas: filasD.map(({ f, c }) => [f.nombre, fmtMM(c.precip), fmtNum(c.tmax), fmtNum(c.tmin), fmtNum(c.hum, 0), fmtNum(c.viento, 0), fmtNum(c.rafaga, 0), fmtNum(c.et0), textoWMO(c.wcode)]), izq: [0, 8] },
  });

  if (S.climaEjemplo) m.notas.unshift('ATENCIÓN: datos de clima SIMULADOS (vista previa). Solo los registros del pluviómetro son reales.');
  return m;

};

  ['estaciones', 'Entre pluviómetros'],
  ['distribucion', 'Distribución de lluvias'],
  ['clima', 'Clima y balance hídrico'],
];
const PERIODOS = [['mes', 'Este mes'], ['mesAnt', 'Mes anterior'], ['30d', 'Últimos 30 días'], ['90d', 'Últimos 90 días'], ['12m', 'Últimos 12 meses'], ['anio', 'Este año'], ['anioAnt', 'Año anterior'], ['agricola', 'Año agrícola (jul–jun)'], ['todo', 'Todo el historial'], ['custom', 'Personalizado…']];
const estadoRep = { tipo: 'fuentes', periodo: 'anio', desde: null, hasta: null, agrupar: null, fuentes: null, anios: null, inicioAnio: 1, datosInter: 'pluv' };
let modeloActual = null;

function agrupacionAuto(per) { const d = diffDays(per.desde, per.hasta); return d <= 45 ? 'dia' : d <= 200 ? 'semana' : d <= 1100 ? 'mes' : 'anio'; }
function fechasPeriodo(per) { const hoy = hoyISO(); return rangoFechas(per.desde, per.hasta > hoy ? hoy : per.hasta); }
const NOMBRE_AGR = { dia: 'día', semana: 'semana', mes: 'mes', anio: 'año' };

/* ---------- Constructores de reportes (modelo independiente del formato) ---------- */
function repFuentes(est, per, agr) {
  const fechas = fechasPeriodo(per);
  const ids = (estadoRep.fuentes || fuentesActivas(f => !f.pronostico).map(f => f.id)).filter(id => FUENTE[id]);
  const m = serieManual(est.id, fechas, S.cfg.lecturaMatinal);
  const porF = ids.map(id => ({ id, f: FUENTE[id], s: serieFuente(est.id, id, fechas) }));
  const prom = fechas.map((f, i) => { const v = porF.map(x => x.s[i]).filter(x => x !== null); return v.length ? redondear(suma(v) / v.length, 1) : null; });
  const umbral = S.cfg.umbralLluvia;
  const stats = porF.map(x => Object.assign({ id: x.id, nombre: x.f.nombre, corto: x.f.corto }, compararSeries(m, x.s, umbral)));
  const sProm = compararSeries(m, prom, umbral);
  const validas = stats.filter(s => s.n);
  const nMax = Math.max(0, ...validas.map(s => s.n));
  const comparables = validas.filter(s => s.n >= nMax * 0.5 && s.difPct !== null);
  const cercana = comparables.slice().sort((a, b) => Math.abs(a.difPct) - Math.abs(b.difPct))[0];
  const correl = comparables.filter(s => s.r !== null).sort((a, b) => b.r - a.r)[0];
  const totalM = suma(m), diasM = m.filter(v => v !== null && v >= umbral).length;
  const modelo = {
    titulo: 'Pluviómetro vs fuentes de clima', est, per,
    kpis: [
      { lbl: 'Pluviómetro', val: fmtMM(totalM) + ' mm', sub: diasM + ' días con lluvia' },
      { lbl: 'Promedio de fuentes', val: sProm.n ? fmtMM(sProm.totalF) + ' mm' : '—', sub: sProm.n ? fmtPct(sProm.difPct) + ' vs pluviómetro (mismos días)' : 'sin datos' },
      { lbl: 'Fuente más próxima', val: cercana ? cercana.corto : '—', sub: cercana ? 'Diferencia ' + fmtPct(cercana.difPct) : '' },
      { lbl: 'Mejor correlación diaria', val: correl ? correl.corto : '—', sub: correl ? 'r = ' + fmtNum(correl.r, 2) : '' },
    ],
    secciones: [],
  };
  if (!porF.length) { modelo.secciones.push({ titulo: 'Sin fuentes', texto: 'Active al menos una fuente en Ajustes.' }); return modelo; }
  // 1) Serie agrupada
  const ag = agruparSeries(fechas, [m, prom, ...porF.map(x => x.s)], agr);
  const mins = ag.claves.map((_, i) => { const v = porF.map((x, j) => ag.valores[2 + j][i]).filter(x => x !== null); return v.length > 1 ? Math.min(...v) : null; });
  const maxs = ag.claves.map((_, i) => { const v = porF.map((x, j) => ag.valores[2 + j][i]).filter(x => x !== null); return v.length > 1 ? Math.max(...v) : null; });
  const filas = ag.claves.map((k, i) => [ag.etiquetas[i], fmtMM(ag.valores[0][i]), fmtMM(ag.valores[1][i]), ...porF.map((x, j) => fmtMM(ag.valores[2 + j][i]))]);
  filas.push(['Total', fmtMM(suma(ag.valores[0])), fmtMM(suma(ag.valores[1])), ...porF.map((x, j) => ag.valores[2 + j].some(v => v !== null) ? fmtMM(suma(ag.valores[2 + j])) : '—')]);
  modelo.secciones.push({
    titulo: 'Lluvia por ' + NOMBRE_AGR[agr],
    texto: 'Barras: pluviómetro. Puntos: promedio de las fuentes seleccionadas. Franja: rango entre la fuente que menos y la que más lluvia estimó.',
    grafico: { tipo: 'grafico', spec: { etiquetas: ag.etiquetas, series: [{ nombre: 'Pluviómetro', color: PALETA[0], valores: ag.valores[0] }, { nombre: 'Promedio de fuentes', color: PALETA[1], tipo: 'punto', valores: ag.valores[1] }], banda: { min: mins, max: maxs, color: GRIS_SERIE, nombre: 'Rango entre fuentes' }, unidad: 'mm', unidadTooltip: 'mm', alto: 260 } },
    tabla: { cab: ['Período', 'Pluv.', 'Prom.', ...porF.map(x => x.f.corto)], filas, ultimaTotal: true },
  });
  // 2) Desvío por fuente
  modelo.secciones.push({
    titulo: 'Desvío de cada fuente respecto del pluviómetro',
    texto: 'Diferencia porcentual del total, contando solo los días con dato en ambos. Positivo: la fuente estimó más lluvia que su pluviómetro; negativo: menos.',
    grafico: { tipo: 'barrasH', spec: { items: stats.map(s => ({ nombre: s.corto, valor: s.n ? s.difPct : null })).concat([{ nombre: 'Promedio', valor: sProm.n ? sProm.difPct : null }]), divergente: true, colorPos: PALETA[1], colorNeg: PALETA[0], formato: fmtPct, titulo: 'Desvío porcentual por fuente' } },
  });
  // 3) Indicadores de precisión
  const filaStat = (nom, s) => s.n ? [nom, String(s.n), fmtMM(s.totalM), fmtMM(s.totalF), fmtPct(s.difPct), fmtNum(s.mae, 1), s.r === null ? '—' : fmtNum(s.r, 2), s.pod === null ? '—' : fmtNum(s.pod, 0) + ' %', s.far === null ? '—' : fmtNum(s.far, 0) + ' %'] : [nom, '0', '—', '—', '—', '—', '—', '—', '—'];
  const filasS = stats.map(s => filaStat(s.nombre, s));
  filasS.push(filaStat('Promedio de fuentes', sProm));
  modelo.secciones.push({
    titulo: 'Precisión de cada fuente frente a su pluviómetro',
    texto: 'Días: días comparados. Error medio: diferencia absoluta promedio por día (mm). Correlación: 1 = coincidencia perfecta día a día. Lluvias detectadas: porcentaje de días con lluvia (≥ ' + fmtNum(umbral) + ' mm) que la fuente también indicó. Falsas alarmas: días que la fuente indicó lluvia sin que su pluviómetro la registrara.',
    tabla: { cab: ['Fuente', 'Días', 'Pluv. mm', 'Fuente mm', 'Diferencia', 'Error medio', 'Correl. (r)', 'Lluvias detectadas', 'Falsas alarmas'], filas: filasS, ultimaTotal: true },
  });
  modelo.notas = [
    S.cfg.lecturaMatinal ? 'Las lecturas registradas antes de las ' + S.cfg.horaCorte + ' se asignaron al día anterior para la comparación.' : 'Comparación por día calendario (00:00–24:00). Si usted lee el pluviómetro por la mañana, active «Lecturas matinales al día anterior» en Ajustes para una comparación más justa.',
    'Los modelos numéricos representan un área de 10 a 25 km; las lluvias convectivas muy localizadas pueden no reflejarse.',
  ];
  return modelo;
}

function repInteranual(est) {
  const inicioMes = estadoRep.inicioAnio;
  const hoy = hoyISO();
  const usarFuente = estadoRep.datosInter !== 'pluv' && FUENTE[estadoRep.datosInter];
  const porDia = usarFuente ? null : lluviaManual(est.id, false);
  const primer = primerRegistro(est.id);
  let disponibles = usarFuente ? (() => { const s = new Set(); for (const c of S.clima.values()) if (c.estacion_id === est.id && c.fuente === estadoRep.datosInter && c.precip !== null) s.add(inicioMes > 1 && mes(c.fecha) < inicioMes ? anio(c.fecha) - 1 : anio(c.fecha)); return Array.from(s).sort(); })()
    : (() => { const s = new Set(); for (const f of porDia.keys()) s.add(inicioMes > 1 && mes(f) < inicioMes ? anio(f) - 1 : anio(f)); return Array.from(s).sort(); })();
  const actual = inicioMes > 1 && mes(hoy) < inicioMes ? anio(hoy) - 1 : anio(hoy);
  if (!disponibles.includes(actual)) disponibles.push(actual);
  const anios = (estadoRep.anios || disponibles.slice(-6)).filter(a => disponibles.includes(a)).slice(-6);
  const etAnio = a => inicioMes > 1 ? a + '/' + String(a + 1).slice(2) : String(a);
  const ordenMeses = Array.from({ length: 12 }, (_, i) => ((inicioMes - 1 + i) % 12) + 1);
  const valorDia = (f) => {
    if (f > hoy) return null;
    if (usarFuente) { const c = climaDe(est.id, f, estadoRep.datosInter); return c ? c.precip : null; }
    if (porDia.has(f)) return porDia.get(f);
    return (S.cfg.sinRegistroCero && primer && f >= primer) ? 0 : null;
  };
  const datos = anios.map(a => {
    const ini = inicioMes > 1 ? a + '-' + pad2(inicioMes) + '-01' : a + '-01-01';
    const fin = addDays(inicioMes > 1 ? (a + 1) + '-' + pad2(inicioMes) + '-01' : (a + 1) + '-01-01', -1);
    const fechas = rangoFechas(ini, fin);
    const vals = fechas.map(valorDia);
    const ag = agruparSeries(fechas, [vals], 'mes');
    let acc = 0; const acum = vals.map((v, i) => { if (fechas[i] > hoy) return null; acc += v || 0; return redondear(acc, 1); });
    const lluv = vals.filter(v => v !== null && v >= S.cfg.umbralLluvia).length;
    let max = null, fMax = null; vals.forEach((v, i) => { if (v !== null && (max === null || v > max)) { max = v; fMax = fechas[i]; } });
    const completo = fin <= hoy && vals.filter(v => v !== null).length >= vals.length - 5;
    return { a, mensual: ag.valores[0], acum, total: suma(vals), lluv, max, fMax, completo, n: vals.filter(v => v !== null).length };
  });
  const completos = datos.filter(d => d.completo);
  const promMes = ordenMeses.map((_, i) => { const v = datos.filter(d => d.a !== actual || true).map(d => d.mensual[i]).filter(v => v !== null); return v.length ? redondear(media(v), 1) : null; });
  const promAnual = completos.length ? media(completos.map(d => d.total)) : null;
  const masLluv = completos.slice().sort((x, y) => y.total - x.total)[0];
  const masSeco = completos.slice().sort((x, y) => x.total - y.total)[0];
  const dAct = datos.find(d => d.a === actual);
  const fuenteTxt = usarFuente ? FUENTE[estadoRep.datosInter].nombre : 'Pluviómetro';
  const modelo = {
    titulo: 'Comparativo interanual' + (inicioMes > 1 ? ' (año agrícola julio–junio)' : ''), est, per: { etiqueta: anios.map(etAnio).join(', ') + ' · ' + fuenteTxt },
    kpis: [
      { lbl: 'Promedio anual', val: promAnual !== null ? fmtMM(promAnual, 0) + ' mm' : '—', sub: completos.length + ' años completos' },
      { lbl: 'Año más lluvioso', val: masLluv ? etAnio(masLluv.a) : '—', sub: masLluv ? fmtMM(masLluv.total, 0) + ' mm' : '' },
      { lbl: 'Año más seco', val: masSeco ? etAnio(masSeco.a) : '—', sub: masSeco ? fmtMM(masSeco.total, 0) + ' mm' : '' },
      { lbl: etAnio(actual) + ' hasta hoy', val: dAct ? fmtMM(dAct.total, 0) + ' mm' : '—', sub: dAct ? dAct.lluv + ' días con lluvia' : '' },
    ],
    secciones: [],
  };
  const colores = (i) => PALETA[i] || GRIS_SERIE;
  const ordenAnios = anios.slice().reverse();
  modelo.secciones.push({
    titulo: 'Lluvia mensual por año', texto: 'Milímetros por mes. Cada color es un año.',
    grafico: { tipo: 'grafico', spec: { etiquetas: ordenMeses.map(m => capital(nombreMes(m, true))), etiquetasTooltip: ordenMeses.map(m => capital(nombreMes(m))), series: ordenAnios.map((a, i) => ({ nombre: etAnio(a), color: colores(i), valores: datos.find(d => d.a === a).mensual })), unidad: 'mm', unidadTooltip: 'mm', alto: 270 } },
    tabla: {
      cab: ['Mes', ...anios.map(etAnio), 'Promedio'],
      filas: ordenMeses.map((m, i) => [capital(nombreMes(m)), ...datos.map(d => fmtMM(d.mensual[i])), fmtMM(promMes[i])]).concat([['Total', ...datos.map(d => fmtMM(d.total)), promAnual !== null ? fmtMM(promAnual) : '—']]),
      ultimaTotal: true,
    },
  });
  // Acumulado
  const largo = Math.max(...datos.map(d => d.acum.length));
  const base = inicioMes > 1 ? '2023-' + pad2(inicioMes) + '-01' : '2024-01-01';
  const ejeFechas = rangoFechas(base, addDays(base, largo - 1));
  const ticks = ordenMeses.map(m => ({ i: ejeFechas.findIndex(f => mes(f) === m && f.slice(8) === '01'), texto: capital(nombreMes(m, true)) })).filter(t => t.i >= 0);
  modelo.secciones.push({
    titulo: 'Lluvia acumulada', texto: 'Acumulado día a día desde el inicio de cada ' + (inicioMes > 1 ? 'año agrícola (1 de julio)' : 'año') + '.',
    grafico: { tipo: 'grafico', spec: { etiquetas: ejeFechas.map(f => fmtFecha(f, 'corta')), ticksX: ticks, series: ordenAnios.map((a, i) => ({ nombre: etAnio(a), color: colores(i), tipo: 'linea', grosor: a === actual ? 2.5 : 2, etiquetaFinal: true, valores: datos.find(d => d.a === a).acum.concat(Array(largo).fill(null)).slice(0, largo) })), unidad: 'mm', unidadTooltip: 'mm', alto: 270, ticksCompactos: true } },
  });
  modelo.secciones.push({
    titulo: 'Resumen por año',
    tabla: {
      cab: ['Año', 'Total mm', 'Días con lluvia', 'Máximo diario', 'Fecha del máximo', 'vs promedio', 'Datos'],
      filas: datos.map(d => [etAnio(d.a), fmtMM(d.total), String(d.lluv), fmtMM(d.max), d.fMax ? fmtFecha(d.fMax, 'num') : '—', promAnual && d.completo ? fmtPct((d.total - promAnual) / promAnual * 100) : (d.completo ? '—' : 'en curso'), d.completo ? 'Completo' : d.n + ' días']),
    },
  });
  modelo.notas = [usarFuente ? 'Datos de la fuente ' + fuenteTxt + ' para la ubicación del pluviómetro.' : 'Datos del pluviómetro ' + est.nombre + '. ' + (S.cfg.sinRegistroCero ? 'Los días sin registro posteriores a la primera lectura se consideran sin lluvia.' : '')];
  return modelo;
}

function repEstaciones(per, agr) {
  const ests = estacionesActivas().slice(0, 6);
  const fechas = fechasPeriodo(per);
  const series = ests.map(e => serieManual(e.id, fechas, false));
  const ag = agruparSeries(fechas, series, agr);
  const modelo = { titulo: 'Comparativo entre pluviómetros', est: { nombre: ests.map(e => e.nombre).join(', ') }, per, kpis: [], secciones: [] };
  if (ests.length < 2) {
    modelo.secciones.push({ titulo: 'Se necesita más de un pluviómetro', texto: 'Agregue otros pluviómetros (por ejemplo, de distintos potreros o estancias) en Ajustes › Pluviómetros para compararlos.' });
    return modelo;
  }
  ests.forEach((e, i) => { const s = series[i]; modelo.kpis.push({ lbl: e.nombre, val: fmtMM(suma(s)) + ' mm', sub: s.filter(v => v !== null && v >= S.cfg.umbralLluvia).length + ' días con lluvia' }); });
  modelo.secciones.push({
    titulo: 'Lluvia por ' + NOMBRE_AGR[agr], texto: 'Milímetros por período en cada pluviómetro.',
    grafico: { tipo: 'grafico', spec: { etiquetas: ag.etiquetas, series: ests.map((e, i) => ({ nombre: e.nombre, color: PALETA[i], valores: ag.valores[i] })), unidad: 'mm', unidadTooltip: 'mm', alto: 260 } },
    tabla: { cab: ['Período', ...ests.map(e => e.nombre)], filas: ag.claves.map((k, i) => [ag.etiquetas[i], ...ests.map((e, j) => fmtMM(ag.valores[j][i]))]).concat([['Total', ...ests.map((e, j) => fmtMM(suma(ag.valores[j])))]]), ultimaTotal: true },
  });
  const filas = ests.map((e, i) => {

    return [e.nombre, fmtMM(suma(s)), String(lluv.length), lluv.length ? fmtMM(suma(lluv) / lluv.length) : '—', fmtMM(max), fm ? fmtFecha(fm, 'num') : '—', primerRegistro(e.id) ? fmtFecha(primerRegistro(e.id), 'num') : '—'];
  });
  modelo.secciones.push({ titulo: 'Resumen por pluviómetro', tabla: { cab: ['Pluviómetro', 'Total mm', 'Días con lluvia', 'mm por día de lluvia', 'Máximo diario', 'Fecha', 'Registra desde'], filas } });
  return modelo;
}

function repDistribucion(est, per) {
  const fechas = fechasPeriodo(per);
  const m = serieManual(est.id, fechas, false);
  const u = S.cfg.umbralLluvia;
  const lluvias = m.map((v, i) => ({ f: fechas[i], v })).filter(x => x.v !== null && x.v >= u);
  const total = suma(lluvias.map(x => x.v));
  const cortes = [u, 5, 10, 25, 50, 100].filter((c, i, a) => i === 0 || c > a[0]);
  const clases = cortes.map((c, i) => ({ desde: c, hasta: cortes[i + 1] || null }));
  const etClase = c => c.hasta ? fmtNum(c.desde) + '–' + fmtNum(c.hasta) + ' mm' : '≥ ' + fmtNum(c.desde) + ' mm';
  const conteo = clases.map(c => lluvias.filter(x => x.v >= c.desde && (c.hasta === null || x.v < c.hasta)));
  const r = rachasSecas(fechas, m, u);
  const ordenadas = lluvias.slice().sort((a, b) => b.v - a.v);
  const mediana = ordenadas.length ? ordenadas[Math.floor(ordenadas.length / 2)].v : null;
  const modelo = {
    titulo: 'Distribución e intensidad de las lluvias', est, per,
    kpis: [
      { lbl: 'Días con lluvia', val: String(lluvias.length), sub: fmtMM(total) + ' mm en total' },
      { lbl: 'Promedio por día de lluvia', val: lluvias.length ? fmtMM(total / lluvias.length) + ' mm' : '—', sub: mediana !== null ? 'Mediana ' + fmtMM(mediana) + ' mm' : '' },
      { lbl: 'Racha seca más larga', val: r.max + ' días', sub: r.inicioMax ? 'Desde ' + fmtFecha(r.inicioMax) : '' },
      { lbl: 'Días sin lluvia al final', val: r.actual + ' días', sub: 'Al ' + fmtFecha(fechas[fechas.length - 1] || hoyISO()) },
    ],
    secciones: [],
  };

function serieCampoRef(estId, fechas, campo) {

    if (!isFinite(lat) || lat < -90 || lat > 90 || !isFinite(lon) || lon < -180 || lon > 180) { aviso('Coordenadas inválidas.', 'error'); return false; }
    const cambioUbic = Math.abs(lat - est.lat) > 0.0005 || Math.abs(lon - est.lon) > 0.0005;
    const obj = Object.assign({}, est, { nombre: inNom.value.trim(), lat: redondear(lat, 5) === null ? lat : +lat.toFixed(5), lon: +lon.toFixed(5), notas: inNotas.value.trim(), ubicacion_verificada: true });
    await guardarFila('estaciones', obj);
    if (nueva) { S.cfg.estacionActiva = obj.id; guardarCfg(); }
    if (cambioUbic || nueva) {
      // Datos de clima de la ubicación anterior: se vuelven a descargar para la nueva
      delete S.meta.cobertura[obj.id];
      const viejos = Array.from(S.clima.values()).filter(c => c.estacion_id === obj.id);
      for (const c of viejos) S.clima.delete(c.id);
      if (S.db && viejos.length) { const tx = S.db.transaction('clima', 'readwrite'); viejos.forEach(c => tx.objectStore('clima').delete(c.id)); }
      guardarMeta();
      setTimeout(() => actualizarClima({ estacion: obj }), 300);
    }

    aviso('Pluviómetro guardado.', 'ok');
    return true;
  } });
  return dialogo({ titulo: nueva ? 'Nuevo pluviómetro' : 'Editar pluviómetro', contenido: cont, botones });
}

        }) }),
        h('button', { class: 'btn', text: 'Iniciar sesión', onclick: accion(async () => { await iniciarSesion(inMail.value.trim(), inPass.value); aviso('Sesión iniciada. Sincronizando…', 'ok'); await sincronizar(); refrescar(); }) }),
        h('button', { class: 'btn fantasma', text: 'Olvidé mi contraseña', onclick: accion(async () => { await recuperarClave(inMail.value.trim()); aviso('Le enviamos un correo para restablecer la contraseña.', 'ok', 5000); }) })),
    h('p', { class: 'texto-tenue', style: { marginTop: '12px' }, text: 'Plan gratuito (Spark) de Firebase: 1 GiB de datos, 50.000 lecturas y 20.000 escrituras por día, sin tarjeta de crédito. Esta app usa una mínima parte.' }));
}
function interruptorCompacto(txt, val, fn) {
  const inp = h('input', { type: 'checkbox', checked: !!val, onchange: e => fn(e.target.checked), style: { margin: '0', accentColor: '#2a6cb8' } });
  return h('label', { class: 'chip', style: { cursor: 'pointer' } }, inp, txt);
}

/* ============================================================
   Arranque de la aplicación
   ============================================================ */

async function iniciar() {
  await cargarTodo();
  await sembrarDatosIniciales();
  aplicarTema();
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if ((S.cfg.tema || 'auto') === 'auto') { aplicarTema(); renderVista(); } }); } catch (e) { /* */ } }
  $('#btn-tema').addEventListener('click', () => cambiarTema(temaResuelto() === 'oscuro' ? 'claro' : 'oscuro'));
  window.addEventListener('beforeprint', () => { document.documentElement.setAttribute('data-tema', 'claro'); $$('.grafico').forEach(c => { if (c._spec) { if (c._tipo === 'barrasH') graficoBarrasH(c, c._spec); else grafico(c, c._spec); } }); });
  window.addEventListener('afterprint', () => { aplicarTema(); renderVista(); });
  if (!S.db && !MODO_VISTA) aviso('Este navegador no permite guardar datos de forma permanente. Use Chrome o instale la app.', 'error', 7000);

  pintarSelectorEstacion();
  pintarEstado();
  $('#sel-estacion').addEventListener('change', e => { S.cfg.estacionActiva = e.target.value; guardarCfg(); renderVista(); pintarEstado(); });
  $('#btn-actualizar').addEventListener('click', async () => {
    await actualizarClima();
    await actualizarHorario();
    if (nubeConectada()) await sincronizar();
    aviso('Datos actualizados.', 'ok');
  });
  $('#fab').addEventListener('click', () => abrirRegistro(null));
  $$('#nav button').forEach(b => b.addEventListener('click', () => { irA(b.dataset.vista); window.scrollTo(0, 0); }));
  window.addEventListener('hashchange', () => { renderVista(); window.scrollTo(0, 0); });

  on('datos', () => { pintarSelectorEstacion(); pintarEstado(); refrescar(); });
  on('sync', () => pintarEstado());
  on('nube', () => pintarEstado());
  on('actualizando', (v) => { $('#btn-actualizar').classList.toggle('girando', !!v); pintarEstado(); });
  on('progreso', (p) => {
    const el = $('#progreso');
    if (!p) { el.classList.add('oculto'); return; }
    el.classList.remove('oculto');
    vaciar(el);
    el.appendChild(h('span', { text: 'Descargando historial climático · ' + p.texto }));
    el.appendChild(h('div', { class: 'barra-p' }, h('i', { style: { width: Math.round(p.i / p.n * 100) + '%' } })));
  });
  setInterval(pintarEstado, 60000);

  renderVista();

  // Actualización automática al abrir (y cada 3 horas si queda abierta)
  setTimeout(async () => {
    await actualizarClima({ silencioso: true });
    await actualizarHorario({ silencioso: true });
    if (nubeConectada()) sincronizar({ silencioso: true });
  }, 600);
  // Al registrar una lluvia nueva, se descarga su clima por hora
  const horarioDiferido = debounce(() => actualizarHorario({ silencioso: true }), 5000);
  on('cambioLocal', (d) => { if (d && d.tabla === 'registros') horarioDiferido(); });
  setInterval(() => actualizarClima({ silencioso: true }), 3 * 3600 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const est = estacionActual();
    const ult = est && S.meta.ultimaActualizacion[est.id];
    if (!ult || Date.now() - new Date(ult).getTime() > 3 * 3600 * 1000) actualizarClima({ silencioso: true });
    if (nubeConectada()) sincronizar({ silencioso: true });
  });

  registrarSW();
}

function registrarSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const preguntar = (w) => {
      dialogo({ titulo: 'Nueva versión disponible', contenido: 'Hay una versión actualizada de la aplicación. Sus datos se conservan.', botones: [{ texto: 'Más tarde', valor: false }, { texto: 'Actualizar', clase: 'primario', valor: true }] })
        .then(ok => { if (ok) w.postMessage('activar'); });
    };
    if (reg.waiting && navigator.serviceWorker.controller) preguntar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) preguntar(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 6 * 3600 * 1000);
  }).catch(() => { /* sin service worker */ });
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (recargando) return; recargando = true; location.reload(); });
}

document.addEventListener('DOMContentLoaded', iniciar);

</script>
