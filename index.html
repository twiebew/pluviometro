<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Pluviométrico</title>
<meta name="description" content="Registro de lluvias con historial climático de múltiples fuentes, reportes comparativos y respaldo en la nube.">
<meta name="theme-color" content="#f3f4f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pluviómetro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(function () { try { var t = localStorage.getItem('pluvio-tema') || 'auto'; var o = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-tema', o ? 'oscuro' : 'claro'); } catch (e) { document.documentElement.setAttribute('data-tema', 'claro'); } })();
</script>
<style>
/* ============================================================
   Registro Pluviométrico · estilos (temas claro y oscuro)
   ============================================================ */
:root, [data-tema="claro"] {
  --bg: #f3f4f6; --sup: #ffffff; --sup-2: #f8f9fb; --sup-3: #eef0f3; --tinta: #111418; --sec: #535b66; --tenue: #858d99;
  --borde: #e5e7eb; --borde-2: #d3d7de; --acento: #17324f; --acento-h: #21456b; --acento-txt: #ffffff;
  --lluvia: #2a6cb8; --lluvia-h: #245fa3; --lluvia-wash: #e8f0fa; --lluvia-wash-2: #d4e3f5;
  --ok: #217a4a; --alerta: #9a6a00; --error: #b23b3b;
  --aviso-bg: #fbf5e6; --aviso-borde: #ecdcae; --aviso-txt: #5c4a14;
  --info-bg: #eef4fb; --info-borde: #d2e1f2; --info-txt: #17324f;
  --barra-bg: rgba(255,255,255,.82); --nav-bg: rgba(255,255,255,.9);
  --sombra: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --sombra-2: 0 10px 30px rgba(16,24,40,.12);
  --heroe-a: #17324f; --heroe-b: #275d96;
  --zebra: #fafbfc; --hover: #f2f6fb; --tabla-cab: #f6f7f9;
  color-scheme: light;
}
[data-tema="oscuro"] {
  --bg: #0f1215; --sup: #1a1f25; --sup-2: #20262d; --sup-3: #262d35; --tinta: #e9ecef; --sec: #b3bac3; --tenue: #8a929c;
  --borde: #2a3139; --borde-2: #39414b; --acento: #4f8fdc; --acento-h: #63a0e8; --acento-txt: #0d1116;
  --lluvia: #4f8fdc; --lluvia-h: #63a0e8; --lluvia-wash: #1b2a3b; --lluvia-wash-2: #22364d;
  --ok: #4cbc7e; --alerta: #d8ad45; --error: #e27a7a;
  --aviso-bg: #2a2416; --aviso-borde: #4a3f22; --aviso-txt: #ead9a6;
  --info-bg: #17232f; --info-borde: #27384a; --info-txt: #c9dcf0;
  --barra-bg: rgba(20,24,29,.82); --nav-bg: rgba(20,24,29,.92);
  --sombra: 0 1px 2px rgba(0,0,0,.3); --sombra-2: 0 12px 36px rgba(0,0,0,.5);
  --heroe-a: #182638; --heroe-b: #1f3e63;
  --zebra: #1d2329; --hover: #222b35; --tabla-cab: #20262d;
  color-scheme: dark;
}
:root {
  --radio: 16px; --radio-c: 11px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-h: 66px; --barra-h: 60px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--tinta); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; transition: background .2s; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--lluvia); }
.oculto { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
svg.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Barra superior ---------- */
.barra { position: sticky; top: 0; z-index: 30; background: var(--barra-bg); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--borde); padding: calc(env(safe-area-inset-top) + 8px) 14px 8px; display: flex; align-items: center; gap: 10px; min-height: var(--barra-h); }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.marca-ico { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(145deg, var(--heroe-a), var(--heroe-b)); display: grid; place-items: center; flex: none; box-shadow: 0 2px 6px rgba(23,50,79,.25); }
.marca-ico svg { width: 20px; height: 20px; }
.marca-tit { font-size: 16.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca-sub { font-size: 12px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
.barra-acc { display: flex; align-items: center; gap: 6px; }
.sel-est { background: var(--sup-3); border: 1px solid transparent; border-radius: 999px; padding: 7px 12px; max-width: 140px; font-size: 13.5px; font-weight: 500; }
.btn-icono { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--sec); cursor: pointer; }
.btn-icono:hover { background: var(--sup-3); color: var(--tinta); }
.btn-icono svg { width: 21px; height: 21px; }
.girando svg { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.punto-sync { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #9aa3ad; flex: none; }
.punto-sync.ok { background: #36b26b; } .punto-sync.error { background: #e06363; } .punto-sync.trabajando { background: #e0b43c; }

/* ---------- Navegación ---------- */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav-bg); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-top: 1px solid var(--borde); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.nav button { background: none; border: 0; padding: 0 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--tenue); font-size: 11.5px; font-weight: 500; cursor: pointer; }
.nav button .pil { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--tinta); font-weight: 650; }
.nav button[aria-current="page"] .pil { background: var(--lluvia-wash-2); color: var(--lluvia); }
main { padding: 16px 14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); max-width: 1180px; margin: 0 auto; animation: entrar .18s ease-out; }
@keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 29; width: 60px; height: 60px; border-radius: 20px; background: var(--lluvia); color: #fff; border: 0; box-shadow: 0 8px 22px rgba(42,108,184,.38), 0 2px 6px rgba(0,0,0,.12); display: grid; place-items: center; cursor: pointer; transition: transform .12s, background .12s; }
.fab:hover { background: var(--lluvia-h); transform: translateY(-1px); }
.fab:active { transform: scale(.96); }
.fab svg { width: 28px; height: 28px; }
@media (min-width: 900px) {
  .nav { top: var(--barra-h); bottom: 0; right: auto; width: 216px; display: flex; flex-direction: column; border-top: 0; border-right: 1px solid var(--borde); padding: 16px 12px; gap: 4px; background: var(--sup); backdrop-filter: none; }
  .nav button { flex-direction: row; gap: 10px; font-size: 14.5px; padding: 0; border-radius: 12px; justify-content: flex-start; }
  .nav button .pil { width: 40px; height: 38px; }
  .nav button:hover { background: var(--sup-3); }
  .nav button[aria-current="page"] { background: var(--lluvia-wash); }
  .nav button[aria-current="page"] .pil { background: transparent; }
  main { margin-left: 216px; padding: 26px 32px 110px; }
  .fab { bottom: 28px; right: 32px; }
}

/* ---------- Tarjetas y tipografía ---------- */
h1, h2, h3 { margin: 0; letter-spacing: -.2px; }
.tit-vista { font-size: 26px; font-weight: 750; letter-spacing: -.6px; margin: 2px 0 16px; }
.tit-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tit-fila .tit-vista { margin: 0; }
.tarjeta { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 18px; margin-bottom: 14px; }
.tarjeta > h2 { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
.tarjeta .bajada { color: var(--sec); font-size: 13px; margin: 0 0 14px; }
.cab-tarjeta { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.cab-tarjeta h2 { font-size: 16px; font-weight: 650; }
.rejilla { display: grid; gap: 14px; }
@media (min-width: 900px) { .rejilla.dos { grid-template-columns: 1fr 1fr; margin-bottom: 14px; } .rejilla.dos > .tarjeta { margin-bottom: 0; } }
.texto-sec { color: var(--sec); } .texto-tenue { color: var(--tenue); font-size: 13px; }
.pequeno { font-size: 12.5px; }

/* Cifra principal */
.heroe { background: linear-gradient(135deg, var(--heroe-a) 0%, var(--heroe-b) 100%); color: #fff; border-radius: 20px; padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden; box-shadow: 0 10px 28px rgba(23,50,79,.22); }
.heroe::after { content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none; }
.heroe-lbl { font-size: 13.5px; opacity: .85; display: flex; align-items: center; gap: 6px; }
.heroe-val { font-size: 56px; font-weight: 700; line-height: 1.02; letter-spacing: -2px; margin-top: 6px; }
.heroe-val small { font-size: 20px; font-weight: 500; opacity: .8; margin-left: 4px; letter-spacing: 0; }
.heroe-pie { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.pastilla { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
.progreso-anual { margin-top: 16px; }
.progreso-anual .pista { height: 8px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; }
.progreso-anual .pista i { display: block; height: 100%; background: #fff; border-radius: 999px; }
.progreso-anual .txt { display: flex; justify-content: space-between; font-size: 12.5px; opacity: .85; margin-top: 6px; gap: 10px; }
.heroe .btn-claro { background: rgba(255,255,255,.95); color: #17324f; border: 0; }

/* Mosaicos */
.mosaicos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 760px) { .mosaicos { grid-template-columns: repeat(4, 1fr); } }
.mosaico { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px; box-shadow: var(--sombra); }
.mosaico-lbl { font-size: 12.5px; color: var(--sec); display: flex; align-items: center; gap: 7px; font-weight: 500; }
.mosaico-lbl .ico-c { width: 26px; height: 26px; border-radius: 8px; background: var(--lluvia-wash); color: var(--lluvia); display: grid; place-items: center; flex: none; }
.mosaico-lbl .ico-c svg { width: 15px; height: 15px; }
.mosaico-val { font-size: 25px; font-weight: 700; margin-top: 8px; letter-spacing: -.5px; }
.mosaico-val small { font-size: 13px; font-weight: 500; color: var(--sec); margin-left: 3px; letter-spacing: 0; }
.mosaico-sub { font-size: 12px; color: var(--tenue); margin-top: 2px; }

/* Avisos dentro de vistas */
.banner { display: flex; gap: 10px; align-items: center; background: var(--aviso-bg); border: 1px solid var(--aviso-borde); color: var(--aviso-txt); border-radius: 14px; padding: 11px 13px; margin-bottom: 14px; font-size: 13.5px; }
.banner.info { background: var(--info-bg); border-color: var(--info-borde); color: var(--info-txt); }
.banner .btn { margin-left: auto; flex: none; }

/* ---------- Botones y formularios ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--borde-2); background: var(--sup); color: var(--tinta); border-radius: var(--radio-c); padding: 9px 14px; cursor: pointer; font-size: 14px; font-weight: 550; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--sup-3); }
.btn svg { width: 17px; height: 17px; }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); }
.btn.primario:hover { background: var(--acento-h); }
.btn.lluvia { background: var(--lluvia); border-color: var(--lluvia); color: #fff; }
.btn.peligro { color: var(--error); border-color: color-mix(in srgb, var(--error) 35%, transparent); }
.btn.fantasma { border-color: transparent; background: transparent; color: var(--sec); }
.btn.fantasma:hover { background: var(--sup-3); color: var(--tinta); }
.btn.chico { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: default; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.campo label, .lbl { font-size: 12.5px; color: var(--sec); font-weight: 600; }
.campo input, .campo select, .campo textarea, .entrada { border: 1px solid var(--borde-2); border-radius: var(--radio-c); padding: 10px 12px; background: var(--sup); width: 100%; }
.campo textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid color-mix(in srgb, var(--lluvia) 55%, transparent); outline-offset: 1px; }
.fila-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mm-caja { background: var(--lluvia-wash); border-radius: 18px; padding: 14px 14px 10px; margin-bottom: 14px; text-align: center; }
.mm-caja label { display: block; font-size: 12.5px; color: var(--sec); font-weight: 600; margin-bottom: 4px; }
.mm-grande { font-size: 46px !important; font-weight: 700; text-align: center; letter-spacing: -1.5px; border: 0 !important; background: transparent !important; padding: 0 !important; width: 100%; color: var(--tinta); }
.mm-grande:focus { outline: none; }
.mm-unidad { font-size: 13px; color: var(--sec); margin-top: -4px; }
.ayuda { font-size: 12.5px; color: var(--tenue); margin-top: -6px; margin-bottom: 12px; }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--borde); }
.interruptor:first-child { border-top: 0; }
.interruptor .txt { flex: 1; min-width: 0; }
.interruptor .txt b { display: block; font-weight: 550; }
.interruptor .txt span { display: block; font-size: 12.5px; color: var(--tenue); }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw span { position: absolute; inset: 0; border-radius: 13px; background: var(--borde-2); transition: background .15s; cursor: pointer; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.sw input:checked + span { background: var(--lluvia); }
.sw input:checked + span::after { transform: translateX(18px); }
.sw input:focus-visible + span { outline: 2px solid var(--lluvia); outline-offset: 2px; }

/* Segmentados, chips, pestañas */
.filtros { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-bottom: 14px; }
.filtros .campo { margin-bottom: 0; min-width: 130px; }
.segmentado { display: inline-flex; background: var(--sup-3); border-radius: 999px; padding: 3px; gap: 2px; }
.segmentado button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--sec); font-weight: 550; }
.segmentado button[aria-pressed="true"] { background: var(--sup); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--borde-2); background: var(--sup); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--sec); display: inline-flex; align-items: center; gap: 6px; font-weight: 550; }
.chip[aria-pressed="true"] { background: var(--lluvia-wash-2); border-color: transparent; color: var(--tinta); }
.chip[aria-pressed="true"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lluvia); }
.navegador { display: inline-flex; align-items: center; gap: 4px; background: var(--sup); border: 1px solid var(--borde); border-radius: 999px; padding: 3px; }
.navegador .btn { border: 0; border-radius: 999px; width: 34px; height: 34px; padding: 0; }
.navegador .actual { min-width: 140px; text-align: center; font-weight: 650; font-size: 14px; }
.pestanas { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; padding-bottom: 2px; }
.pestanas::-webkit-scrollbar { display: none; }
.pestanas button { border: 1px solid var(--borde); background: var(--sup); padding: 8px 14px; white-space: nowrap; cursor: pointer; color: var(--sec); border-radius: 999px; font-size: 13.5px; font-weight: 550; }
.pestanas button[aria-selected="true"] { color: var(--acento-txt); background: var(--acento); border-color: var(--acento); }

/* ---------- Tablas ---------- */
.tabla-env { overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--borde); border-radius: 12px; }
table.tabla { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; background: var(--sup); }
.tabla th, .tabla td { padding: 8px 11px; border-bottom: 1px solid var(--borde); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tabla th { background: var(--tabla-cab); color: var(--sec); font-weight: 650; font-size: 12px; position: sticky; top: 0; z-index: 1; }
.tabla th:first-child, .tabla td:first-child { text-align: left; position: sticky; left: 0; z-index: 2; }
.tabla td:first-child { background: inherit; }
.tabla tbody tr { background: var(--sup); }
.tabla tbody tr:nth-child(even) { background: var(--zebra); }
.tabla thead th:first-child { background: var(--tabla-cab); z-index: 3; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla td.izq, .tabla th.izq { text-align: left; }
.tabla tr.clic { cursor: pointer; }
.tabla tr.clic:hover td { background: var(--hover); }
.tabla tr.total td { font-weight: 700; background: var(--tabla-cab); }
.tabla td.lluvia-dia { font-weight: 700; color: var(--lluvia); }
.tabla td.cero { color: var(--tenue); opacity: .6; }
.tabla tr.resaltada td { background: var(--lluvia-wash) !important; }
.etiq { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--sup-3); color: var(--sec); margin-left: 5px; vertical-align: 1px; font-weight: 600; }
.etiq.pron { background: var(--lluvia-wash); color: var(--lluvia); }

/* ---------- Gráficos ---------- */
.grafico { position: relative; width: 100%; }
.grafico svg { display: block; width: 100%; height: auto; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--sec); margin-bottom: 10px; }
.ley-item { display: inline-flex; align-items: center; gap: 6px; }
.ley-caja { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.ley-linea { width: 16px; height: 2.5px; border-radius: 2px; display: inline-block; }
.ley-punto { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.tooltip { position: absolute; display: none; pointer-events: none; background: var(--sup); border: 1px solid var(--borde-2); border-radius: 12px; box-shadow: var(--sombra-2); padding: 9px 11px; font-size: 12.5px; z-index: 5; min-width: 140px; }
.tt-tit { color: var(--sec); margin-bottom: 4px; font-weight: 600; }
.tt-fila { display: flex; align-items: center; gap: 7px; line-height: 1.6; }
.tt-key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tt-fila strong { font-variant-numeric: tabular-nums; }
.tt-nom { color: var(--sec); }
.tt-sec { color: var(--tenue); font-size: 12px; }

/* ---------- Pronóstico ---------- */
.pronostico { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: thin; }
.pron-dia { flex: 0 0 96px; scroll-snap-align: start; border: 1px solid var(--borde); border-radius: 16px; padding: 11px 8px; text-align: center; background: var(--sup-2); }
.pron-dia.hoy { border-color: transparent; background: var(--lluvia-wash); }
.pron-fecha { font-size: 12.5px; color: var(--sec); font-weight: 650; text-transform: capitalize; }
.ico-wx { width: 32px; height: 32px; fill: none; stroke: var(--sec); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 6px auto 4px; display: block; }
.pron-mm { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
.pron-mm small { font-size: 11.5px; color: var(--sec); font-weight: 500; }
.pron-rango { font-size: 11.5px; color: var(--tenue); min-height: 15px; }
.pron-temp { font-size: 12.5px; color: var(--sec); margin-top: 4px; }
.pron-cons { margin-top: 7px; }
.pron-cons .pista { height: 4px; border-radius: 999px; background: var(--borde); overflow: hidden; }
.pron-cons .pista i { display: block; height: 100%; background: var(--lluvia); border-radius: 999px; }
.pron-cons span { display: block; font-size: 10.5px; color: var(--tenue); margin-top: 3px; }

/* ---------- Listas ---------- */
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--borde); }
.lista li:first-child { border-top: 0; }
.lista li.clic { cursor: pointer; border-radius: 10px; }
.lista li.clic:hover { background: var(--hover); }
.lista .gota { width: 46px; height: 46px; border-radius: 14px; background: var(--lluvia-wash); color: var(--lluvia); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1.05; }
.lista .gota b { font-size: 16px; font-weight: 750; letter-spacing: -.3px; }
.lista .gota small { font-size: 10px; font-weight: 600; opacity: .8; }
.lista .mm { font-size: 18px; font-weight: 700; min-width: 74px; font-variant-numeric: tabular-nums; }
.lista .mm small { font-size: 12px; color: var(--sec); font-weight: 500; }
.lista .det { flex: 1; min-width: 0; }
.lista .det b { font-weight: 600; display: block; }
.lista .det span { font-size: 12.5px; color: var(--tenue); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista .flecha { color: var(--tenue); }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tenue); flex: none; }
.estado.ok::before { background: var(--ok); } .estado.error::before { background: var(--error); } .estado.alerta::before { background: #d4a72c; }

/* ---------- Ajustes (acordeones) ---------- */
details.seccion { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--radio); margin-bottom: 10px; box-shadow: var(--sombra); overflow: hidden; }
details.seccion > summary { list-style: none; cursor: pointer; padding: 15px 16px; display: flex; align-items: center; gap: 12px; }
details.seccion > summary::-webkit-details-marker { display: none; }
details.seccion > summary .s-ico { width: 36px; height: 36px; border-radius: 11px; background: var(--sup-3); color: var(--sec); display: grid; place-items: center; flex: none; }
details.seccion > summary .s-ico svg { width: 19px; height: 19px; }
details.seccion > summary .s-tit { font-weight: 650; }
details.seccion > summary .s-sub { font-size: 12.5px; color: var(--tenue); }
details.seccion > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 1.8px solid var(--tenue); border-bottom: 1.8px solid var(--tenue); transform: rotate(45deg); transition: transform .15s; flex: none; }
details.seccion[open] > summary::after { transform: rotate(-135deg); }
details.seccion > .cuerpo { padding: 14px 16px 16px; border-top: 1px solid var(--borde); }
pre.codigo { background: var(--sup-2); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; font-size: 11.5px; max-height: 220px; overflow: auto; white-space: pre; }
ol.pasos { padding-left: 20px; margin: 6px 0 12px; } ol.pasos li { margin-bottom: 6px; }

/* ---------- Hoja modal ---------- */
.velo { position: fixed; inset: 0; background: rgba(10,14,18,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: aparecer .15s ease-out; }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
.hoja { background: var(--sup); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: var(--sombra-2); animation: subir .2s cubic-bezier(.2,.8,.2,1); }
.hoja::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--borde-2); margin: 0 auto 10px; }
@media (min-width: 700px) { .velo { align-items: center; } .hoja { border-radius: 22px; max-height: 88vh; padding-top: 18px; } .hoja::before { display: none; } }
@keyframes subir { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
.hoja-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.hoja-cab h2 { font-size: 20px; font-weight: 750; letter-spacing: -.4px; }
.hoja-pie { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.hoja-pie .btn { min-height: 42px; }
.cerrar { border: 0; background: var(--sup-3); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; color: var(--sec); }

/* ---------- Avisos flotantes ---------- */
#avisos { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
.aviso { background: #1f252c; color: #fff; padding: 11px 15px; border-radius: 14px; font-size: 14px; box-shadow: var(--sombra-2); pointer-events: auto; animation: subir .2s ease-out; }
.aviso.error { background: #8a2c2c; } .aviso.ok { background: #1f5a3b; }
.progreso { position: fixed; top: calc(var(--barra-h) + env(safe-area-inset-top)); left: 0; right: 0; z-index: 31; background: var(--aviso-bg); border-bottom: 1px solid var(--aviso-borde); color: var(--aviso-txt); font-size: 12.5px; padding: 6px 14px; display: flex; align-items: center; gap: 10px; }
.progreso .barra-p { flex: 1; max-width: 220px; height: 4px; background: var(--aviso-borde); border-radius: 2px; overflow: hidden; }
.progreso .barra-p i { display: block; height: 100%; background: #b38a1f; }

/* ---------- Mapa ---------- */
.mapa { width: 100%; height: 420px; border: 0; border-radius: 12px; background: var(--sup-3); display: block; color: var(--sec); }
@media (max-width: 600px) { .mapa { height: 360px; } }

/* ---------- Reportes ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { border: 1px solid var(--borde); border-radius: 14px; padding: 12px 13px; background: var(--sup-2); }
.kpi-lbl { font-size: 12.5px; color: var(--sec); font-weight: 500; }
.kpi-val { font-size: 22px; font-weight: 700; margin-top: 3px; letter-spacing: -.4px; }
.kpi-sub { font-size: 12px; color: var(--tenue); }
.rep-seccion { margin-bottom: 22px; }
.rep-seccion > h3 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
.rep-seccion > p { font-size: 13px; color: var(--sec); margin: 0 0 12px; }
.vacio { text-align: center; color: var(--tenue); padding: 26px 10px; font-size: 14px; }
.pie-fuentes { font-size: 11.5px; color: var(--tenue); margin-top: 10px; }

/* ---------- Vista del día ---------- */
.dia-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dia-tit { font-size: 24px; font-weight: 750; letter-spacing: -.6px; }
.dia-sub { color: var(--sec); font-size: 13.5px; margin-bottom: 14px; }
.dia-nav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 14px; }

/* ---------- Impresión ---------- */
@media print {
  @page { size: A4; margin: 16mm; }
  :root { --sup: #fff; --tinta: #000; --sec: #333; --borde: #999; }
  body { background: #fff; font-family: "Times New Roman", Times, serif; color: #000; }
  .barra, .nav, .fab, #avisos, .progreso, .no-imprimir, .filtros, .pestanas, .chips { display: none !important; }
  main { margin: 0 !important; padding: 0 !important; max-width: none; animation: none; }
  .tarjeta, .heroe { border: 0; box-shadow: none; padding: 0; }
  .imprimir-tit { display: block !important; }
  .tabla-env { border: 0; overflow: visible; }
  .tabla th { position: static; background: #f2f2f2 !important; color: #000; }
  .tabla td, .tabla th { border: 1px solid #999; }
  .tabla th:first-child, .tabla td:first-child { position: static; }
  .rep-seccion { break-inside: avoid; }
  .kpi { border: 1px solid #999; background: #fff; }
  .tooltip { display: none !important; }
}
.imprimir-tit { display: none; }

</style>
</head>

function abrirDB() {
  return new Promise((resolve) => {
    if (!('indexedDB' in window)) { resolve(null); return; }
    let req;
    try { req = indexedDB.open(DB_NOMBRE, DB_VERSION); } catch (e) { resolve(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const t of TABLAS) if (!db.objectStoreNames.contains(t)) db.createObjectStore(t, { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
  });
}

function idbTodos(tabla) {
  return new Promise((resolve) => {
    if (!S.db) { resolve([]); return; }
    try {
      const tx = S.db.transaction(tabla, 'readonly');
      const r = tx.objectStore(tabla).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => resolve([]);
    } catch (e) { resolve([]); }
  });
}
function idbPonerMuchos(tabla, objs) {
  return new Promise((resolve) => {
    if (!S.db || !objs.length) { resolve(true); return; }
    try {
      const tx = S.db.transaction(tabla, 'readwrite');
      const st = tx.objectStore(tabla);
      for (const o of objs) st.put(o);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
      tx.onabort = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

      return;
    }
    try {
      const r = S.db.transaction('kv', 'readonly').objectStore('kv').get(k);

      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

function fusionarDefecto(def, val) {
  const out = JSON.parse(JSON.stringify(def));
  if (!val || typeof val !== 'object') return out;
  for (const k in val) {
    if (val[k] && typeof val[k] === 'object' && !Array.isArray(val[k]) && def[k] && typeof def[k] === 'object') out[k] = Object.assign({}, def[k], val[k]);
    else out[k] = val[k];
  }
  return out;
}

// opts.remoto = viene de la nube (no marcar para subir)
async function guardarFilas(tabla, objs, opts) {
  opts = opts || {};

  const lista = [];
  for (const o of objs) {
    const n = Object.assign({}, o);
    if (!opts.remoto) { n.updated_at = opts.conservarFecha && n.updated_at ? n.updated_at : ahora; n._dirty = 1; }
    else { n._dirty = 0; }
    if (n.deleted === undefined) n.deleted = false;
    S[tabla].set(n.id, n);
    lista.push(n);
  }
  await idbPonerMuchos(tabla, lista);

  if (!opts.remoto) emitir('cambioLocal', { tabla });
  return lista;
}

  for (const id of ids) { const o = S[tabla].get(id); if (o && o._dirty) { o._dirty = 0; lista.push(o); } }

}

/* ---------- HTTP ---------- */
async function pedirJSON(url, opciones, ms) {
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const t = ctrl ? setTimeout(() => ctrl.abort(), ms || 45000) : null;
  let r;
  try {
    r = await fetch(url, Object.assign({}, opciones || {}, ctrl ? { signal: ctrl.signal } : {}));
  } catch (e) {
    if (t) clearTimeout(t);
    const err = new Error(e.name === 'AbortError' ? 'Tiempo de espera agotado' : 'Sin conexión con el servicio');
    err.red = true; throw err;
  }
  if (t) clearTimeout(t);
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) { cuerpo = null; }
  if (!r.ok) {
    const msg = (cuerpo && (cuerpo.reason || cuerpo.message || cuerpo.error_description || cuerpo.msg || cuerpo.error || (cuerpo.messages && cuerpo.messages.join(' ')))) || ('Error HTTP ' + r.status);
    const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
    err.status = r.status; err.cuerpo = cuerpo; throw err;
  }
  return cuerpo;
}

/* ---------- Open-Meteo: modelos (archivo de pronósticos y pronóstico actual) ---------- */
async function omModelos(est, fuentes, desde, hasta, endpoint) {
  const vars = OM_VARS.map(v => v[0]);
  const base = endpoint === 'actual' ? 'https://api.open-meteo.com/v1/forecast' : 'https://historical-forecast-api.open-meteo.com/v1/forecast';
  const intentar = async (lista) => {
    const q = new URLSearchParams({
      latitude: est.lat, longitude: est.lon, daily: lista.join(','), models: fuentes.map(f => f.modelo).join(','),
      timezone: TZ, start_date: desde, end_date: hasta,
    });
    return pedirJSON(base + '?' + q.toString());
  };
  let json;
  try { json = await intentar(vars); }
  catch (e) {
    if (e.status === 400) json = await intentar(vars.filter(v => !OM_OPCIONALES.includes(v)));
    else throw e;
  }
  const d = json.daily || {};
  const filas = [];
  (d.time || []).forEach((fecha, i) => {
    for (const f of fuentes) {
      const fila = { fecha, fuente: f.id };
      let alguno = false;
      for (const [api, campo] of OM_VARS) {
        const arr = d[api + '_' + f.modelo] || (fuentes.length === 1 ? d[api] : null);
        const v = arr ? arr[i] : null;
        fila[campo] = (v === null || v === undefined) ? null : v;
        if (fila[campo] !== null && campo !== 'wcode') alguno = true;
      }
      if (alguno && fila.precip !== null) filas.push(fila);
    }
  });
  return filas;
}

async function omArchivo(est, desde, hasta) {

    latitude: est.lat, longitude: est.lon, daily: lista.join(','), timezone: TZ, start_date: desde, end_date: hasta,
  }).toString());

  catch (e) {
    if (e.status === 400) json = await intentar(vars.filter(v => !OM_OPCIONALES.includes(v)));
    else throw e;
  }
  const d = json.daily || {};
  const filas = [];
  (d.time || []).forEach((fecha, i) => {
    const fila = { fecha, fuente: 'era5' };
    for (const [api, campo] of OM_VARS) { const arr = d[api]; const v = arr ? arr[i] : null; fila[campo] = (v === null || v === undefined) ? null : v; }
    if (fila.precip !== null) filas.push(fila);
  });

}

/* ---------- NASA POWER ---------- */
async function nasaPower(est, desde, hasta) {
  const q = new URLSearchParams({
    parameters: 'PRECTOTCORR,T2M_MAX,T2M_MIN,RH2M,WS2M_MAX', community: 'AG',
    longitude: est.lon, latitude: est.lat, start: desde.replace(/-/g, ''), end: hasta.replace(/-/g, ''),
    format: 'JSON', 'time-standard': 'LST',
  });
  const json = await pedirJSON('https://power.larc.nasa.gov/api/temporal/daily/point?' + q.toString(), null, 60000);
  const p = (json.properties && json.properties.parameter) || {};
  const pr = p.PRECTOTCORR || {};
  const ok = v => (v === undefined || v === null || v <= -998) ? null : v;
  const filas = [];
  for (const k of Object.keys(pr)) {
    const fecha = k.slice(0, 4) + '-' + k.slice(4, 6) + '-' + k.slice(6, 8);
    const precip = ok(pr[k]);
    if (precip === null) continue;
    filas.push({
      fecha, fuente: 'nasa', precip: redondear(precip, 1),
      tmax: ok((p.T2M_MAX || {})[k]), tmin: ok((p.T2M_MIN || {})[k]), hum: ok((p.RH2M || {})[k]),
      viento: ok((p.WS2M_MAX || {})[k]) !== null ? redondear(ok((p.WS2M_MAX || {})[k]) * 3.6, 1) : null,
      rafaga: null, dir: null, et0: null, wcode: null,
    });
  }
  return filas;
}

/* ---------- Foreca (pronóstico diario, requiere token) ---------- */
async function foreca(est) {
  const url = 'https://weatherapi.foreca.net/api/v1/forecast/daily/' + est.lon + ',' + est.lat + '?periods=8&dataset=full&windunit=KMH&tempunit=C';
  const json = await pedirJSON(url, { headers: { Authorization: 'Bearer ' + claveFuente('foreca') } });
  return (json.forecast || []).map(d => ({
    fecha: d.date, fuente: 'foreca', precip: d.precipAccum ?? null, tmax: d.maxTemp ?? null, tmin: d.minTemp ?? null,
    hum: d.maxRelHumidity !== undefined && d.minRelHumidity !== undefined ? (d.maxRelHumidity + d.minRelHumidity) / 2 : null,
    viento: d.maxWindSpeed ?? null, rafaga: d.maxWindGust ?? null, dir: d.windDir ?? null, et0: null, wcode: null,
  })).filter(f => f.fecha && f.precip !== null);
}

/* ---------- Windy Point Forecast (requiere clave) ---------- */
async function windy(est) {
  const json = await pedirJSON('https://api.windy.com/api/point-forecast/v2', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lat: +est.lat, lon: +est.lon, model: S.cfg.windyModelo || 'gfs', parameters: ['temp', 'precip', 'wind'], levels: ['surface'], key: claveFuente('windy') }),
  });
  const ts = json.ts || [];
  const pr = json['past3hprecip-surface'] || [];
  const te = json['temp-surface'] || [];
  const wu = json['wind_u-surface'] || [], wv = json['wind_v-surface'] || [];
  const uP = (json.units && json.units['past3hprecip-surface']) || 'm';
  const fac = uP === 'mm' ? 1 : 1000;
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const dias = {};
  ts.forEach((t, i) => {
    const fecha = fmt.format(new Date(t - 90 * 60000));
    const d = dias[fecha] = dias[fecha] || { n: 0, precip: 0, tmax: -1e9, tmin: 1e9, viento: 0 };
    d.n++;
    if (pr[i] !== null && pr[i] !== undefined) d.precip += pr[i] * fac;
    if (te[i] !== null && te[i] !== undefined) { const c = te[i] - 273.15; d.tmax = Math.max(d.tmax, c); d.tmin = Math.min(d.tmin, c); }
    if (wu[i] !== undefined && wv[i] !== undefined) d.viento = Math.max(d.viento, Math.hypot(wu[i], wv[i]) * 3.6);
  });
  return Object.entries(dias).filter(([, d]) => d.n >= 7).map(([fecha, d]) => ({
    fecha, fuente: 'windy', precip: redondear(d.precip, 1), tmax: redondear(d.tmax, 1), tmin: redondear(d.tmin, 1),
    hum: null, viento: redondear(d.viento, 1), rafaga: null, dir: null, et0: null, wcode: null,
  }));
}

/* ---------- Guardado (solo si cambió) ---------- */
async function guardarClima(est, filas) {
  const ahora = ahoraISO();
  const cambios = [];
  for (const f of filas) {
    const id = climaId(est.id, f.fecha, f.fuente);
    const prev = S.clima.get(id);
    const nuevo = { id, estacion_id: est.id, fecha: f.fecha, fuente: f.fuente, fetched_at: ahora };
    for (const c of CAMPOS_CLIMA) nuevo[c] = (f[c] === undefined || f[c] === null) ? null : (c === 'wcode' || c === 'dir' ? Math.round(f[c]) : redondear(f[c], 1));
    if (prev) {
      const igual = CAMPOS_CLIMA.every(c => (prev[c] ?? null) === (nuevo[c] ?? null));
      if (igual) continue;
    }
    cambios.push(nuevo);
  }
  if (cambios.length) await guardarFilas('clima', cambios, { silencioso: true });
  return cambios.length;
}

function estadoFuente(id, ok, msg) {
  S.meta.estadoFuentes[id] = { ok, msg: msg || '', at: ahoraISO() };
}

/* ---------- Orquestación ---------- */
let actualizando = false;
function trozosAnuales(desde, hasta) {
  const out = [];
  let a = desde;
  while (a <= hasta) {
    const finAnio = a.slice(0, 4) + '-12-31';
    const b = finAnio < hasta ? finAnio : hasta;
    out.push([a, b]);
    a = addDays(b, 1);
  }
  return out;
}

async function actualizarClima(opts) {
  opts = opts || {};
  if (actualizando) return;
  if (!navigator.onLine) { if (!opts.silencioso) aviso('Sin conexión. Se usarán los datos guardados.'); return; }
  const estaciones = opts.estacion ? [opts.estacion] : estacionesActivas();
  if (!estaciones.length) return;
  actualizando = true;
  emitir('actualizando', true);
  const hoy = hoyISO();
  let total = 0;
  try {
    for (const est of estaciones) {
      if (!isFinite(+est.lat) || !isFinite(+est.lon)) continue;
      const cob = S.meta.cobertura[est.id] = S.meta.cobertura[est.id] || {};
      const inicio = S.cfg.inicioHistorial || addDays(hoy, -90);
      const tareas = [];

      // Modelos numéricos (Open-Meteo)
      const om = fuentesActivas(f => f.tipo === 'om');
      if (om.length) {
        const grupos = {};
        for (const f of om) {
          const ini = inicio > f.desde ? inicio : f.desde;
          const finPasado = addDays(hoy, -5);
          let rango = null;
          const c = cob[f.id];
          if (!c) rango = [ini, finPasado];
          else if (c.desde > ini) rango = [ini, addDays(c.desde, -1)];
          if (c && c.hasta < addDays(hoy, -12)) rango = [rango ? rango[0] : addDays(c.hasta, -3), finPasado];
          if (rango && rango[0] <= rango[1]) { const k = rango.join('|'); (grupos[k] = grupos[k] || []).push(f); }
        }
        for (const k in grupos) {
          const [a, b] = k.split('|');
          for (const [x, y] of trozosAnuales(a, b)) {
            tareas.push({ etiqueta: 'Modelos ' + x.slice(0, 4), fn: () => omModelos(est, grupos[k], x, y, 'historico'), fuentes: grupos[k].map(f => f.id), rango: [x, y] });
          }
        }
        tareas.push({ etiqueta: 'Modelos (reciente y pronóstico)', fn: () => omModelos(est, om, addDays(hoy, -10), addDays(hoy, 7), 'actual'), fuentes: om.map(f => f.id), rango: [addDays(hoy, -10), hoy], reciente: true });
      }
      // Archivo histórico ERA5
      if (S.cfg.fuentes.era5) {
        const c = cob.era5;
        const fin = addDays(hoy, -1);
        let a = c ? (c.desde > inicio ? inicio : addDays(c.hasta, -12)) : inicio;
        if (c && c.desde > inicio) { for (const [x, y] of trozosAnuales(inicio, addDays(c.desde, -1))) tareas.push({ etiqueta: 'ERA5 ' + x.slice(0, 4), fn: () => omArchivo(est, x, y), fuentes: ['era5'], rango: [x, y] }); a = addDays(c.hasta, -12); }
        for (const [x, y] of trozosAnuales(a, fin)) tareas.push({ etiqueta: 'ERA5 ' + x.slice(0, 4), fn: () => omArchivo(est, x, y), fuentes: ['era5'], rango: [x, y] });
      }
      // NASA POWER
      if (S.cfg.fuentes.nasa) {
        const c = cob.nasa;
        const fin = addDays(hoy, -1);
        let a = c ? addDays(c.hasta, -15) : inicio;
        if (c && c.desde > inicio) tareas.push({ etiqueta: 'NASA POWER', fn: () => nasaPower(est, inicio, addDays(c.desde, -1)), fuentes: ['nasa'], rango: [inicio, addDays(c.desde, -1)] });
        tareas.push({ etiqueta: 'NASA POWER', fn: () => nasaPower(est, a, fin), fuentes: ['nasa'], rango: [a, fin] });
      }
      if (S.cfg.fuentes.foreca && claveFuente('foreca')) tareas.push({ etiqueta: 'Foreca', fn: () => foreca(est), fuentes: ['foreca'], pronostico: true });
      if (S.cfg.fuentes.windy && claveFuente('windy')) tareas.push({ etiqueta: 'Windy', fn: () => windy(est), fuentes: ['windy'], pronostico: true });

      let i = 0;
      for (const t of tareas) {
        i++;
        if (tareas.length > 3 && !opts.silencioso) emitir('progreso', { texto: est.nombre + ': ' + t.etiqueta, i, n: tareas.length });
        try {
          const filas = await t.fn();
          total += await guardarClima(est, filas);
          for (const id of t.fuentes) {
            estadoFuente(id, true, filas.length ? '' : 'Sin datos para el período');
            if (t.rango) {
              const c = cob[id];
              const [x, y] = t.rango;
              cob[id] = c ? { desde: x < c.desde ? x : c.desde, hasta: y > c.hasta ? y : c.hasta } : { desde: x, hasta: y };
            }
          }
        } catch (e) {
          console.warn(t.etiqueta, e);
          for (const id of t.fuentes) estadoFuente(id, false, e.message);
        }
      }
      S.meta.ultimaActualizacion[est.id] = ahoraISO();
    }
  } finally {
    actualizando = false;
    await guardarMetaYa();
    emitir('progreso', null);
    emitir('actualizando', false);
    emitir('datos', { tabla: 'clima' });
    if (total) emitir('cambioLocal', { tabla: 'clima' });
  }
  return total;
}

/* ============================================================
   Clima hora por hora para los días con registros
   (ref = archivo histórico ECMWF IFS / ERA5; modelos = lluvia horaria)
   ============================================================ */
const H_VARS = [['precipitation', 'precip'], ['temperature_2m', 'temp'], ['relative_humidity_2m', 'hum'], ['dew_point_2m', 'rocio'], ['cloud_cover', 'nubes'],
  ['pressure_msl', 'presion'], ['wind_speed_10m', 'viento'], ['wind_gusts_10m', 'rafaga'], ['wind_direction_10m', 'dir'], ['weather_code', 'wcode']];
function horarioId(est, fecha, fuente) { return est + '|' + fecha + '|' + fuente; }
function horarioDe(est, fecha, fuente) { return S.horario.get(horarioId(est, fecha, fuente)) || null; }

function filasHorarias(est, hourly, fuente, sufijo, campos, dias, origen) {
  const porDia = {};
  (hourly.time || []).forEach((t, i) => {
    const fecha = t.slice(0, 10);
    if (dias && !dias.has(fecha)) return;
    const hora = +t.slice(11, 13);
    const d = porDia[fecha] = porDia[fecha] || {};
    for (const [api, campo] of campos) {
      const arr = hourly[api + sufijo] || (sufijo ? null : hourly[api]);
      if (!arr) continue;
      (d[campo] = d[campo] || Array(24).fill(null))[hora] = arr[i] === undefined ? null : arr[i];
    }
  });
  const filas = [];
  for (const fecha in porDia) {
    const horas = porDia[fecha];
    if (!horas.precip || horas.precip.every(v => v === null)) continue;
    for (const k in horas) horas[k] = horas[k].map(v => v === null ? null : Math.round(v * 10) / 10);
    filas.push({ id: horarioId(est.id, fecha, fuente), estacion_id: est.id, fecha, fuente, origen, horas });
  }
  return filas;
}
async function omHorarioRef(est, desde, hasta, reciente, dias) {
  const base = reciente ? 'https://api.open-meteo.com/v1/forecast' : 'https://archive-api.open-meteo.com/v1/archive';
  const q = new URLSearchParams({ latitude: est.lat, longitude: est.lon, hourly: H_VARS.map(v => v[0]).join(','), timezone: TZ, start_date: desde, end_date: hasta });
  const json = await pedirJSON(base + '?' + q.toString(), null, 60000);
  return filasHorarias(est, json.hourly || {}, 'ref', '', H_VARS, dias, reciente ? 'reciente' : 'archivo');
}
async function omHorarioModelos(est, fuentes, desde, hasta, reciente, dias) {
  const base = reciente ? 'https://api.open-meteo.com/v1/forecast' : 'https://historical-forecast-api.open-meteo.com/v1/forecast';
  const q = new URLSearchParams({ latitude: est.lat, longitude: est.lon, hourly: 'precipitation', models: fuentes.map(f => f.modelo).join(','), timezone: TZ, start_date: desde, end_date: hasta });
  const json = await pedirJSON(base + '?' + q.toString(), null, 60000);
  const out = [];
  for (const f of fuentes) out.push(...filasHorarias(est, json.hourly || {}, f.id, fuentes.length === 1 ? '' : '_' + f.modelo, [['precipitation', 'precip']], dias, reciente ? 'reciente' : 'archivo'));
  return out;
}
async function guardarHorario(filas) {
  const ahora = ahoraISO();
  const cambios = [];
  for (const f of filas) {
    const prev = S.horario.get(f.id);
    if (prev && prev.origen === f.origen && JSON.stringify(prev.horas) === JSON.stringify(f.horas)) continue;
    cambios.push(Object.assign({}, f, { fetched_at: ahora }));
  }
  if (cambios.length) await guardarFilas('horario', cambios, { silencioso: true });
  return cambios.length;
}

let actualizandoH = false;
// opts: { estacion, fechas:[...] (días adicionales a descargar) }
async function actualizarHorario(opts) {
  opts = opts || {};
  if (actualizandoH || !navigator.onLine) return 0;
  actualizandoH = true;
  const hoy = hoyISO();
  const limite = addDays(hoy, -6);
  let total = 0;
  try {
    const estaciones = opts.estacion ? [opts.estacion] : estacionesActivas();
    for (const est of estaciones) {
      if (!isFinite(+est.lat) || !isFinite(+est.lon)) continue;
      const dias = new Set();
      for (const r of registrosDe(est.id)) if (r.fecha <= hoy) { dias.add(r.fecha); dias.add(addDays(r.fecha, -1)); }
      (opts.fechas || []).forEach(f => { if (f <= hoy) dias.add(f); });
      const vencido = (x, f) => !x || (x.origen === 'reciente' && f < limite);
      const om = fuentesActivas(f => f.tipo === 'om');
      const faltan = [...dias].filter(f => vencido(horarioDe(est.id, f, 'ref'), f) || om.some(fu => (!fu.desde || f >= fu.desde) && vencido(horarioDe(est.id, f, fu.id), f))).sort();
      if (!faltan.length) continue;
      const grupos = {};
      for (const f of faltan) { const k = f < limite ? f.slice(0, 4) : 'reciente'; (grupos[k] = grupos[k] || []).push(f); }
      for (const k in grupos) {
        const lista = grupos[k];
        const set = new Set(lista);
        const reciente = k === 'reciente';
        const a = lista[0], b = lista[lista.length - 1];
        if (!opts.silencioso) emitir('progreso', { texto: est.nombre + ': clima por hora ' + (reciente ? 'reciente' : k), i: 1, n: 2 });
        try { total += await guardarHorario(await omHorarioRef(est, a, b, reciente, set)); estadoFuente('horario', true); }
        catch (e) { console.warn('horario ref', e); estadoFuente('horario', false, e.message); }
        if (om.length) {
          try { total += await guardarHorario(await omHorarioModelos(est, om, a, b, reciente, set)); }
          catch (e) { console.warn('horario modelos', e); }
        }
      }
    }
  } finally {
    actualizandoH = false;
    emitir('progreso', null);
    if (total) { emitir('datos', { tabla: 'horario' }); emitir('cambioLocal', { tabla: 'horario' }); }
    guardarMeta();
  }
  return total;
}

/* ============================================================
   Importación de historiales (formato «Rain Gauge» y CSV genérico)
   ============================================================ */

const COORD_DEFECTO = { lat: -22.379, lon: -59.851 }; // Loma Plata (centro)

function parsearCSV(texto) {
  const t = texto.replace(/^﻿/, '');
  const primera = t.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = (primera.split(';').length > primera.split(',').length) ? ';' : (primera.includes('\t') ? '\t' : ',');
  const filas = [];
  let fila = [], campo = '', comillas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (comillas) {
      if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else comillas = false; }
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === sep) { fila.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && t[i + 1] === '\n') i++;
      fila.push(campo); campo = '';
      if (fila.some(x => x.trim() !== '')) filas.push(fila.map(x => x.trim()));
      fila = [];
    } else campo += c;
  }
  fila.push(campo);
  if (fila.some(x => x.trim() !== '')) filas.push(fila.map(x => x.trim()));
  return filas;
}

const MESES_TXT = {
  ene: 1, jan: 1, feb: 2, mar: 3, abr: 4, apr: 4, may: 5, jun: 6, jul: 7, ago: 8, aug: 8,
  sep: 9, sept: 9, set: 9, oct: 10, nov: 11, dic: 12, dec: 12,
};
function parsearFecha(s) {
  if (!s) return null;
  s = s.trim().toLowerCase().replace(/\./g, '');
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  if ((m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad2(m[2]) + '-' + pad2(m[1]); }
  if ((m = s.match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\s+(?:de\s+)?(\d{4})/))) {
    const mm = MESES_TXT[m[2].slice(0, 4)] || MESES_TXT[m[2].slice(0, 3)];
    if (mm) return m[3] + '-' + pad2(mm) + '-' + pad2(m[1]);
  }
  return null;
}
function parsearHora(s) {
  if (!s) return '';
  const m = String(s).match(/(\d{1,2}):(\d{2})/);
  return m ? pad2(m[1]) + ':' + m[2] : '';
}
function parsearMM(s) {
  if (s === null || s === undefined) return NaN;
  const m = String(s).replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : NaN;
}
function idRegistroImportado(estId, fecha, hora, mm) { return 'imp-' + hashStr(estId + '|' + fecha + '|' + hora + '|' + mm); }
function idEstacionPorNombre(nombre) {
  const n = nombre.trim().toLowerCase();
  if (n === 'casa') return 'est-casa';
  return 'est-' + hashStr(n).slice(0, 12);
}

// Devuelve { estaciones: [...], registros: [...], errores: n, formato }
function interpretarHistorial(texto, estDefecto) {
  const filas = parsearCSV(texto);
  const res = { estaciones: [], registros: [], errores: 0, formato: 'csv' };
  const idxGauge = filas.findIndex(f => (f[0] || '').toLowerCase() === 'gauge name');
  const idxLluvia = filas.findIndex(f => (f[0] || '').toLowerCase() === 'rainfall');
  if (idxLluvia >= 0) {
    // Formato de la app «Rain Gauge»
    res.formato = 'Rain Gauge';
    const gauges = {};
    if (idxGauge >= 0) {
      for (let i = idxGauge + 1; i < idxLluvia; i++) {
        const f = filas[i];
        const nombre = f[0] || 'Pluviómetro';
        const gid = f[4] !== undefined ? f[4] : String(i);
        gauges[gid] = { id: idEstacionPorNombre(nombre), nombre, notas: f[1] || '' };
      }
    }
    for (const g of Object.values(gauges)) res.estaciones.push(g);
    for (let i = idxLluvia + 1; i < filas.length; i++) {
      const f = filas[i];
      const mm = parsearMM(f[0]);
      const fecha = parsearFecha(f[1]);
      if (!fecha || !isFinite(mm)) { res.errores++; continue; }
      const hora = parsearHora(f[2]);
      const g = gauges[f[4]] || (estDefecto ? { id: estDefecto } : Object.values(gauges)[0]);
      if (!g) { res.errores++; continue; }
      res.registros.push({ id: idRegistroImportado(g.id, fecha, hora, mm), estacion_id: g.id, fecha, hora, mm, obs: f[3] || '', origen: 'importado' });
    }
    return res;
  }
  // CSV genérico: busca columnas de fecha y milímetros
  const cab = (filas[0] || []).map(c => c.toLowerCase());
  const tieneCab = cab.some(c => /fecha|date|mm|lluvia|rain|precip/.test(c));
  const col = (re, def) => { const i = cab.findIndex(c => re.test(c)); return i >= 0 ? i : def; };
  const cFecha = tieneCab ? col(/fecha|date|d[ií]a/, 0) : 0;
  const cMM = tieneCab ? col(/mm|lluvia|rain|precip/, 1) : 1;
  const cHora = tieneCab ? col(/hora|time/, -1) : -1;
  const cObs = tieneCab ? col(/obs|nota|note|coment/, -1) : -1;
  const cEst = tieneCab ? col(/estaci|pluvi[oó]metro|gauge|lugar/, -1) : -1;
  const estNombres = {};
  for (let i = tieneCab ? 1 : 0; i < filas.length; i++) {
    const f = filas[i];
    const fecha = parsearFecha(f[cFecha]);
    const mm = parsearMM(f[cMM]);
    if (!fecha || !isFinite(mm)) { res.errores++; continue; }
    let estId = estDefecto;
    if (cEst >= 0 && f[cEst]) {
      estId = idEstacionPorNombre(f[cEst]);
      if (!estNombres[estId]) { estNombres[estId] = true; res.estaciones.push({ id: estId, nombre: f[cEst] }); }
    }
    const hora = cHora >= 0 ? parsearHora(f[cHora]) : '';
    res.registros.push({ id: idRegistroImportado(estId, fecha, hora, mm), estacion_id: estId, fecha, hora, mm, obs: cObs >= 0 ? (f[cObs] || '') : '', origen: 'importado' });
  }
  return res;
}

async function aplicarImportacion(res, opts) {
  opts = opts || {};
  const fechaFija = opts.semilla ? '2000-01-01T00:00:00.000Z' : null;
  const nuevasEst = [];
  for (const e of res.estaciones) {
    const existente = S.estaciones.get(e.id) || estacionesActivas().find(x => x.nombre.trim().toLowerCase() === e.nombre.trim().toLowerCase());
    if (existente) {
      if (existente.id !== e.id) res.registros.forEach(r => { if (r.estacion_id === e.id) { r.estacion_id = existente.id; r.id = idRegistroImportado(existente.id, r.fecha, r.hora, r.mm); } });
      continue;
    }
    nuevasEst.push({ id: e.id, nombre: e.nombre, lat: COORD_DEFECTO.lat, lon: COORD_DEFECTO.lon, notas: e.notas || '', ubicacion_verificada: false, orden: estacionesActivas().length + nuevasEst.length });
  }
  if (fechaFija) nuevasEst.forEach(e => { e.updated_at = fechaFija; });
  if (nuevasEst.length) await guardarFilas('estaciones', nuevasEst, { silencioso: true, conservarFecha: !!fechaFija });
  const nuevos = res.registros.filter(r => !S.registros.has(r.id));
  if (fechaFija) nuevos.forEach(r => { r.updated_at = fechaFija; });
  if (nuevos.length) await guardarFilas('registros', nuevos, { silencioso: true, conservarFecha: !!fechaFija });
  // Ampliar el inicio del historial climático si hay lecturas más antiguas
  const minFecha = res.registros.reduce((m, r) => (!m || r.fecha < m ? r.fecha : m), null);
  if (minFecha && (!S.cfg.inicioHistorial || minFecha < S.cfg.inicioHistorial)) { S.cfg.inicioHistorial = minFecha.slice(0, 8) + '01'; guardarCfg(); }
  emitir('datos', { tabla: 'registros' });
  return { estaciones: nuevasEst.length, registros: nuevos.length, duplicados: res.registros.length - nuevos.length, errores: res.errores };
}

async function sembrarDatosIniciales() {
  if (S.meta.semillaImportada) return;
  if (!S.estaciones.size) {
    await guardarFilas('estaciones', [{ id: 'est-casa', nombre: 'Casa', lat: COORD_DEFECTO.lat, lon: COORD_DEFECTO.lon, notas: 'Pluviómetro principal', ubicacion_verificada: false, orden: 0, updated_at: '2000-01-01T00:00:00.000Z' }], { silencioso: true, conservarFecha: true });
  }
  if (typeof HISTORIAL_INICIAL === 'string' && HISTORIAL_INICIAL.trim()) {
    const res = interpretarHistorial(HISTORIAL_INICIAL, 'est-casa');

}

/* ============================================================
   Cálculos: series diarias, agrupaciones, comparaciones
   ============================================================ */

function primerRegistro(estId) {
  let m = null;
  for (const r of S.registros.values()) if (!r.deleted && r.estacion_id === estId && (!m || r.fecha < m)) m = r.fecha;
  return m;
}

// Mapa fecha -> mm del pluviómetro. Con matinal=true, las lecturas antes de la hora de corte se asignan al día anterior.
function lluviaManual(estId, matinal) {
  const mapa = new Map();
  const corte = S.cfg.horaCorte || '10:00';
  for (const r of S.registros.values()) {
    if (r.deleted || r.estacion_id !== estId) continue;
    let f = r.fecha;
    if (matinal && r.hora && r.hora < corte) f = addDays(f, -1);
    mapa.set(f, (mapa.get(f) || 0) + (+r.mm || 0));
  }
  return mapa;
}

// Serie diaria del pluviómetro para un rango (null fuera del período registrado)
function serieManual(estId, fechas, matinal) {
  const mapa = lluviaManual(estId, matinal);
  const inicio = primerRegistro(estId);
  const hoy = hoyISO();
  return fechas.map(f => {
    if (mapa.has(f)) return redondear(mapa.get(f), 1);
    if (!S.cfg.sinRegistroCero) return null;
    if (!inicio || f < inicio || f > hoy) return null;
    return 0;
  });
}

function serieFuente(estId, fuente, fechas, campo) {
  campo = campo || 'precip';
  return fechas.map(f => { const c = S.clima.get(climaId(estId, f, fuente)); return c && c[campo] !== null && c[campo] !== undefined ? c[campo] : null; });
}

function promedioFuentes(estId, fecha, fuentes, campo) {
  campo = campo || 'precip';
  const vals = [];
  for (const id of fuentes) { const c = S.clima.get(climaId(estId, fecha, id)); if (c && c[campo] !== null && c[campo] !== undefined) vals.push(c[campo]); }
  if (!vals.length) return { media: null, min: null, max: null, n: 0, vals };
  return { media: suma(vals) / vals.length, min: Math.min(...vals), max: Math.max(...vals), n: vals.length, vals };
}
function seriePromedio(estId, fuentes, fechas, campo) { return fechas.map(f => { const p = promedioFuentes(estId, f, fuentes, campo); return p.media === null ? null : redondear(p.media, 1); }); }

const ORDEN_REF = ['era5', 'ecmwf', 'icon', 'gfs', 'ukmo', 'mf', 'nasa', 'jma', 'gem', 'foreca', 'windy'];
function climaReferencia(estId, fecha) {
  const orden = [S.cfg.refTemp].concat(ORDEN_REF.filter(x => x !== S.cfg.refTemp));
  for (const id of orden) {
    const c = S.clima.get(climaId(estId, fecha, id));
    if (c && (c.tmax !== null || c.precip !== null)) return c;
  }
  return null;
}

/* ---------- Agrupación por período ---------- */
function claveGrupo(f, modo, inicioAnio) {
  if (modo === 'semana') return inicioSemana(f);
  if (modo === 'mes') return f.slice(0, 7);
  if (modo === 'anio') {
    if (inicioAnio && inicioAnio > 1) { const y = anio(f), m = mes(f); return String(m >= inicioAnio ? y : y - 1); }
    return f.slice(0, 4);
  }
  return f;
}
function etiquetaGrupo(k, modo, inicioAnio) {
  if (modo === 'semana') return 'Sem. ' + fmtFecha(k, 'corta');
  if (modo === 'mes') return capital(nombreMes(+k.slice(5, 7), true)) + ' ' + k.slice(2, 4);
  if (modo === 'anio') return inicioAnio && inicioAnio > 1 ? k + '/' + String(+k + 1).slice(2) : k;
  return fmtFecha(k, 'corta');
}
// series: [{valores:[...]}] alineadas con fechas. Suma por grupo (null si el grupo no tiene datos).
function agruparSeries(fechas, series, modo, inicioAnio, operacion) {
  const claves = [];
  const idx = new Map();
  fechas.forEach((f, i) => {
    const k = claveGrupo(f, modo, inicioAnio);
    if (!idx.has(k)) { idx.set(k, claves.length); claves.push(k); }
  });
  const out = series.map(() => claves.map(() => ({ s: 0, n: 0, max: null, min: null })));
  fechas.forEach((f, i) => {
    const g = idx.get(claveGrupo(f, modo, inicioAnio));
    series.forEach((se, j) => {
      const v = se[i];
      if (v === null || v === undefined) return;
      const o = out[j][g]; o.s += v; o.n++;
      o.max = o.max === null ? v : Math.max(o.max, v); o.min = o.min === null ? v : Math.min(o.min, v);
    });
  });
  return {
    claves, etiquetas: claves.map(k => etiquetaGrupo(k, modo, inicioAnio)),
    valores: out.map(a => a.map(o => o.n ? redondear(operacion === 'media' ? o.s / o.n : operacion === 'max' ? o.max : operacion === 'min' ? o.min : o.s, 1) : null)),
  };
}

/* ---------- Estadísticos de comparación pluviómetro vs fuente ---------- */
function compararSeries(m, f, umbral) {
  umbral = umbral || 1;
  let n = 0, sm = 0, sf = 0, sae = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
  let hits = 0, misses = 0, falsas = 0, negs = 0;
  for (let i = 0; i < m.length; i++) {
    const x = m[i], y = f[i];
    if (x === null || y === null || x === undefined || y === undefined) continue;
    n++; sm += x; sf += y; sae += Math.abs(y - x);
    sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
    const lm = x >= umbral, lf = y >= umbral;
    if (lm && lf) hits++; else if (lm && !lf) misses++; else if (!lm && lf) falsas++; else negs++;
  }
  if (!n) return { n: 0 };
  const den = Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy));
  const r = den > 0 ? (n * sxy - sx * sy) / den : null;
  return {
    n, totalM: sm, totalF: sf, dif: sf - sm, difPct: sm > 0 ? (sf - sm) / sm * 100 : null,
    mae: sae / n, r, hits, misses, falsas, negs,
    pod: (hits + misses) ? hits / (hits + misses) * 100 : null,
    far: (hits + falsas) ? falsas / (hits + falsas) * 100 : null,
    acierto: (hits + misses + falsas + negs) ? (hits + negs) / n * 100 : null,
  };
}

/* ---------- Períodos predefinidos ---------- */
function periodoPreset(clave, extra) {
  const hoy = hoyISO();
  const y = anio(hoy);
  switch (clave) {
    case 'mes': return { desde: inicioMes(hoy), hasta: hoy, etiqueta: capital(nombreMes(mes(hoy))) + ' ' + y };
    case 'mesAnt': { const a = addDays(inicioMes(hoy), -1); return { desde: inicioMes(a), hasta: finMes(a), etiqueta: capital(nombreMes(mes(a))) + ' ' + anio(a) }; }
    case '30d': return { desde: addDays(hoy, -29), hasta: hoy, etiqueta: 'Últimos 30 días' };
    case '90d': return { desde: addDays(hoy, -89), hasta: hoy, etiqueta: 'Últimos 90 días' };
    case '12m': return { desde: addDays(hoy, -364), hasta: hoy, etiqueta: 'Últimos 12 meses' };
    case 'anio': return { desde: y + '-01-01', hasta: hoy, etiqueta: 'Año ' + y };
    case 'anioAnt': return { desde: (y - 1) + '-01-01', hasta: (y - 1) + '-12-31', etiqueta: 'Año ' + (y - 1) };
    case 'agricola': { const ini = mes(hoy) >= 7 ? y : y - 1; return { desde: ini + '-07-01', hasta: hoy, etiqueta: 'Año agrícola ' + ini + '/' + String(ini + 1).slice(2) }; }
    case 'todo': { const p = primerRegistro(S.cfg.estacionActiva) || addDays(hoy, -365); return { desde: p, hasta: hoy, etiqueta: 'Todo el historial' }; }
    case 'custom': return { desde: extra.desde, hasta: extra.hasta, etiqueta: fmtFecha(extra.desde, 'num') + ' – ' + fmtFecha(extra.hasta, 'num') };
  }
  return periodoPreset('anio');
}

function aniosConDatos(estId) {
  const s = new Set();
  for (const r of S.registros.values()) if (!r.deleted && (!estId || r.estacion_id === estId)) s.add(anio(r.fecha));
  return Array.from(s).sort();
}

// Rachas secas (días consecutivos con menos que el umbral)
function rachasSecas(fechas, serie, umbral) {
  let max = 0, actual = 0, inicioMax = null, ini = null;
  fechas.forEach((f, i) => {
    const v = serie[i];
    if (v === null) { actual = 0; ini = null; return; }
    if (v < umbral) { if (!actual) ini = f; actual++; if (actual > max) { max = actual; inicioMax = ini; } }
    else { actual = 0; ini = null; }
  });
  return { max, inicioMax, actual };
}

/* ---------- Resumen para el inicio ---------- */
function resumenEstacion(estId) {
  const hoy = hoyISO();
  const y = anio(hoy);
  const regs = registrosDe(estId);
  const porDia = lluviaManual(estId, false);
  let anioTot = 0, mesTot = 0, diasMes = 0, diasAnio = 0, maxDia = null;
  let anioAntMismaFecha = 0;
  const md = hoy.slice(5);
  for (const [f, v] of porDia) {
    if (anio(f) === y && f <= hoy) { anioTot += v; if (v >= S.cfg.umbralLluvia) diasAnio++; if (!maxDia || v > maxDia.mm) maxDia = { fecha: f, mm: v }; }
    if (f.slice(0, 7) === hoy.slice(0, 7)) { mesTot += v; if (v >= S.cfg.umbralLluvia) diasMes++; }
    if (anio(f) === y - 1 && f.slice(5) <= md) anioAntMismaFecha += v;
  }
  const ultima = [...porDia.entries()].filter(([f, v]) => v > 0 && f <= hoy).sort((a, b) => b[0].localeCompare(a[0]))[0] || null;
  // Promedio del mes actual en años anteriores
  const anios = aniosConDatos(estId).filter(a => a < y);
  const mesesPrev = anios.map(a => { let s = 0; for (const [f, v] of porDia) if (anio(f) === a && mes(f) === mes(hoy)) s += v; return s; });
  return {
    anioTot, mesTot, diasMes, diasAnio, maxDia, anioAntMismaFecha, tieneAnioAnt: anios.includes(y - 1),
    ultima: ultima ? { fecha: ultima[0], mm: ultima[1], dias: diffDays(ultima[0], hoy) } : null,
    promMes: mesesPrev.length ? media(mesesPrev) : null, nRegistros: regs.length,
  };
}

    spec.series.forEach(s => {
      const v = s.valores[i];

        h('span', { class: 'tt-key', style: { background: col(s.color) } }),
        h('strong', { text: v === null || v === undefined ? '—' : fmtNum(v, spec.decimales === 0 ? 0 : 1) + (spec.unidadTooltip ? ' ' + spec.unidadTooltip : '') }),
        h('span', { class: 'tt-nom', text: s.nombre })));

    et.textContent = it.nombre; svg.appendChild(et);

    const p = svgEl('path', { d, fill: color });
    const tt = svgEl('title', {}); tt.textContent = it.nombre + ': ' + (spec.formato ? spec.formato(v) : fmtNum(v, spec.decimales));

/* ============================================================
   Sincronización con Google Firebase
   (Firebase Authentication + Cloud Firestore, API REST, sin librerías)
   Cada usuario guarda sus datos en /usuarios/{uid}/… y las reglas
   de seguridad impiden que otro usuario los lea o modifique.
   ============================================================ */

const REGLAS_FIRESTORE = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Cada usuario solo puede leer y escribir dentro de su propia carpeta
    match /usuarios/{uid}/{documento=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
  }
}`;

function fb() { return S.cfg.fb || {}; }

// Extrae apiKey y projectId del bloque firebaseConfig pegado desde la consola
function leerConfigFirebase(texto) {

/* ---------- Valores de Firestore ---------- */
function aFS(v) {
  if (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(aFS) } };
  if (typeof v === 'object') { const f = {}; for (const k in v) f[k] = aFS(v[k]); return { mapValue: { fields: f } }; }
  return { stringValue: String(v) };
}
function deFS(x) {
  if (!x || 'nullValue' in x) return null;
  if ('booleanValue' in x) return x.booleanValue;
  if ('integerValue' in x) return Number(x.integerValue);
  if ('doubleValue' in x) return Number(x.doubleValue);
  if ('stringValue' in x) return x.stringValue;
  if ('timestampValue' in x) return x.timestampValue;
  if ('arrayValue' in x) return (x.arrayValue.values || []).map(deFS);
  if ('mapValue' in x) { const o = {}; const f = x.mapValue.fields || {}; for (const k in f) o[k] = deFS(f[k]); return o; }
  return null;
}
function camposFS(obj) { const f = {}; for (const k in obj) f[k] = aFS(obj[k]); return f; }

/* ---------- Autenticación ---------- */
const ERRORES_AUTH = {
  EMAIL_NOT_FOUND: 'No existe una cuenta con ese correo.',
  INVALID_PASSWORD: 'Contraseña incorrecta.',
  INVALID_LOGIN_CREDENTIALS: 'Correo o contraseña incorrectos.',
  EMAIL_EXISTS: 'Ya existe una cuenta con ese correo. Use «Iniciar sesión».',
  WEAK_PASSWORD: 'La contraseña debe tener al menos 6 caracteres.',
  INVALID_EMAIL: 'El correo no es válido.',
  OPERATION_NOT_ALLOWED: 'Active «Correo electrónico/contraseña» en Firebase › Authentication › Método de acceso.',
  CONFIGURATION_NOT_FOUND: 'Active Authentication en la consola de Firebase (botón «Comenzar»).',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Demasiados intentos. Espere unos minutos.',
  USER_DISABLED: 'La cuenta está deshabilitada.',
  TOKEN_EXPIRED: 'La sesión expiró. Inicie sesión nuevamente.',
  INVALID_REFRESH_TOKEN: 'La sesión expiró. Inicie sesión nuevamente.',
};
async function fbFetch(url, opciones, esAuth) {
  let r;
  try { r = await fetch(url, opciones); } catch (e) { throw new Error('Sin conexión con Google Firebase.'); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
  if (!r.ok) {
    const crudo = (j && j.error && (j.error.message || j.error.status)) || ('Error HTTP ' + r.status);
    const clave = String(crudo).split(' ')[0].split(':')[0];
    let msg = ERRORES_AUTH[clave] || crudo;
    if (/API key not valid|API_KEY_INVALID/i.test(crudo)) msg = 'La clave de API (apiKey) no es válida.';
    if (/Transaction too big|too large|exceeds the maximum/i.test(crudo)) msg = 'Envío demasiado grande; se reintentará en partes.';
    if (!esAuth && (r.status === 404 || /does not exist|NOT_FOUND/i.test(crudo))) msg = 'No se encontró la base Firestore. Créela en la consola de Firebase (Firestore Database › Crear base de datos).';
    if (!esAuth && (r.status === 403 || /PERMISSION_DENIED|insufficient permissions/i.test(crudo))) msg = /has not been used|disabled/i.test(crudo) ? 'Firestore no está habilitado en el proyecto. Cree la base de datos en la consola.' : 'Permiso denegado: publique las reglas de seguridad indicadas en Ajustes.';
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return j;
}
function guardarSesion(j) {
  const idToken = j.idToken || j.id_token;
  if (!idToken) return false;
  const anterior = S.meta.sesion || {};
  S.meta.sesion = {
    idToken, refreshToken: j.refreshToken || j.refresh_token,
    expires_at: Date.now() + (+(j.expiresIn || j.expires_in) || 3600) * 1000,
    user: { id: j.localId || j.user_id || (anterior.user && anterior.user.id), email: j.email || (anterior.user && anterior.user.email) || S.cfg.fb.email },
  };
  guardarMetaYa();
  return true;
}
function authPost(metodo, cuerpo) {
  return fbFetch('https://identitytoolkit.googleapis.com/v1/accounts:' + metodo + '?key=' + encodeURIComponent(fb().apiKey), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo),
  }, true);
}
async function iniciarSesion(email, clave) {
  const j = await authPost('signInWithPassword', { email, password: clave, returnSecureToken: true });
  guardarSesion(j); S.cfg.fb.email = email; guardarCfg(); emitir('nube', null);
  return j;
}
async function crearCuenta(email, clave) {
  const j = await authPost('signUp', { email, password: clave, returnSecureToken: true });
  guardarSesion(j); S.cfg.fb.email = email; guardarCfg(); emitir('nube', null);
  return { conectado: true };
}
async function recuperarClave(email) { await authPost('sendOobCode', { requestType: 'PASSWORD_RESET', email }); }
async function cerrarSesion() {
  S.meta.sesion = null; S.meta.ultimoPull = {}; await guardarMetaYa();
  emitir('nube', null);
}
async function tokenVigente() {
  const s = S.meta.sesion;
  if (!s) throw new Error('No hay sesión iniciada');
  if (Date.now() < s.expires_at - 120000) return s.idToken;
  const j = await fbFetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(fb().apiKey), {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken),
  }, true);
  if (!guardarSesion(j)) throw new Error('La sesión expiró. Inicie sesión nuevamente.');
  return S.meta.sesion.idToken;
}

/* ---------- Firestore ---------- */
function rutaBD() { return 'projects/' + fb().projectId + '/databases/(default)/documents'; }
function nombreDoc(col, id) { return rutaBD() + '/usuarios/' + S.meta.sesion.user.id + '/' + col + '/' + id; }
async function fsPost(sufijo, cuerpo) {
  const token = await tokenVigente();
  return fbFetch('https://firestore.googleapis.com/v1/' + sufijo, {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(cuerpo),
  });
}
async function fsCommit(escrituras) {
  if (!escrituras.length) return;
  try { await fsPost(rutaBD() + ':commit', { writes: escrituras }); }
  catch (e) {

/* ---------- Sincronización ---------- */
let sincronizando = false;

async function sincronizar(opts) {
  opts = opts || {};

  sincronizando = true;
  emitir('sync', { estado: 'trabajando' });
  const res = { subidos: 0, bajados: 0 };
  try {
    // 1) Bajar primero los cambios de otros dispositivos (gana la edición más reciente)
    for (const t of Object.keys(COLECCIONES)) {
      const def = COLECCIONES[t];
      const ultimo = S.meta.ultimoPull[t];
      const desde = ultimo ? new Date(new Date(ultimo).getTime() - 120000).toISOString() : null;
      const limite = def.mensual ? 40 : 500;
      let offset = 0, maxSrv = ultimo || null;
      for (;;) {
        const docs = await fsConsulta(def.col, desde, offset, limite);
        if (!docs.length) break;
        const aplicar = [];
        for (const d of docs) {
          if (d.srv && (!maxSrv || d.srv > maxSrv)) maxSrv = d.srv;
          if (def.mensual) {
            let filas = d.filas || {};
            if (typeof d.datos === 'string') { try { filas = JSON.parse(d.datos); } catch (e) { filas = {}; } }
            for (const clave in filas) {
              const [fecha, fuente] = clave.split('|');
              const id = d.estacion_id + '|' + fecha + '|' + fuente;
              const local = S[t].get(id);
              if (local && local._dirty) continue;
              const nuevo = Object.assign({ id, estacion_id: d.estacion_id, fecha, fuente, updated_at: d.srv, deleted: false }, filas[clave]);
              if (local && def.campos.every(c => JSON.stringify(local[c] ?? null) === JSON.stringify(nuevo[c] ?? null))) continue;
              aplicar.push(nuevo);
            }
          } else {
            const nuevo = { id: d._id };
            for (const c of def.campos) nuevo[c] = d[c] === undefined ? null : d[c];
            const local = S[t].get(nuevo.id);
            if (local && local._dirty && (local.updated_at || '') > (nuevo.updated_at || '')) continue;
            if (local && !local._dirty && local.updated_at === nuevo.updated_at && !!local.deleted === !!nuevo.deleted) continue;
            aplicar.push(nuevo);

        if (docs.length < limite) break;
        offset += limite;
      }
      if (maxSrv) S.meta.ultimoPull[t] = maxSrv;
    }

    let lote = [], tam = 0, limpiar = [];
    const vaciarLote = async () => {
      if (!lote.length) return;
      await fsCommit(lote);
      for (const [t, ids] of limpiar) await marcarLimpias(t, ids);
      lote = []; tam = 0; limpiar = [];
    };
    const agregar = async (w, t, ids) => {
      const peso = JSON.stringify(w).length;
      if (lote.length && (lote.length >= 60 || tam + peso > 700000)) await vaciarLote();
      lote.push(w); tam += peso; limpiar.push([t, ids]);
    };
    for (const t of ['estaciones', 'registros']) {
      const def = COLECCIONES[t];
      for (const o of S[t].values()) {
        if (!o._dirty) continue;
        const datos = {}; for (const c of def.campos) datos[c] = o[c] === undefined ? null : o[c];
        if (datos.deleted === null) datos.deleted = false;
        await agregar(escritura(def.col, o.id, datos), t, [o.id]);
        res.subidos++;
      }
    }
    for (const t of ['clima', 'horario']) {
      const def = COLECCIONES[t];
      const meses = new Map();
      for (const o of S[t].values()) if (o._dirty && !o._ejemplo) { const k = claveMes(o); if (!meses.has(k)) meses.set(k, []); }
      if (!meses.size) continue;
      for (const o of S[t].values()) { if (o._ejemplo) continue; const k = claveMes(o); if (meses.has(k)) meses.get(k).push(o); }
      for (const [k, filas] of meses) {
        const [est, m] = [k.slice(0, k.lastIndexOf('|')), k.slice(k.lastIndexOf('|') + 1)];
        const mapa = {};

      }
    }
    await vaciarLote();

    S.meta.ultimaSync = ahoraISO();
    S.meta.errorSync = null;
    await guardarMetaYa();
    if (res.bajados) emitir('datos', { tabla: 'todas' });
    emitir('sync', { estado: 'ok', res });
    return res;
  } catch (e) {
    console.warn('sync', e);
    S.meta.errorSync = e.message;
    guardarMeta();
    emitir('sync', { estado: 'error', error: e.message });
    if (!opts.silencioso) aviso('Sincronización: ' + e.message, 'error', 6000);
    return null;
  } finally {
    sincronizando = false;
  }
}
const syncDiferida = debounce(() => { if (S.cfg.autoSync) sincronizar({ silencioso: true }); }, 4000);
on('cambioLocal', () => syncDiferida());

function pendientesSync() {
  let n = 0;
  for (const t of Object.keys(COLECCIONES)) for (const o of S[t].values()) if (o._dirty && !o._ejemplo) n++;
  return n;
}
